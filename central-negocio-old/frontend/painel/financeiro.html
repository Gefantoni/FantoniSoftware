<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Financeiro — Central do Negócio</title>
  <script src="https://unpkg.com/@phosphor-icons/web"></script>
  <link rel="stylesheet" href="/assets/css/global.css">
  <link rel="stylesheet" href="/assets/css/painel.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>

<body>
  <div class="app-layout">
    <aside class="app-sidebar" id="sidebar"></aside>

    <main class="app-content">
      <header class="app-header" id="topbar"></header>

      <div class="pagina">
        <!-- Indicadores -->
        <div class="grid-3 mb-3" id="indicadores">
          <div class="metrica-card">
            <div class="metrica-label">Melhor Mês</div>
            <div class="metrica-valor" id="melhor-mes">—</div>
          </div>
          <div class="metrica-card">
            <div class="metrica-label">Crescimento</div>
            <div class="metrica-valor" id="crescimento">—</div>
          </div>
          <div class="metrica-card">
            <div class="metrica-label">Meta do Mês</div>
            <div class="metrica-valor" id="meta-status">—</div>
          </div>
        </div>

        <!-- Formulário de lançamento + Gráfico -->
        <div class="grid-2 mb-3">
          <div class="card">
            <h3 class="card-titulo">Lançamento Mensal</h3>
            <form id="form-financeiro" onsubmit="salvarLancamento(event)">
              <div class="grid-2">
                <div class="form-grupo">
                  <label>Mês</label>
                  <select id="fin-mes" required>
                    ${Array.from({length:12},(_,i)=>`<option value="${i+1}" ${new Date().getMonth()===i?'selected':''}>
                      ${['Jan','Fev','Mar','Abr','Mai','Jun','Jul','Ago','Set','Out','Nov','Dez'][i]}</option>
                    `).join('')}
                  </select>
                </div>
                <div class="form-grupo">
                  <label>Ano</label>
                  <input type="number" id="fin-ano" value="${new Date().getFullYear()}" required min="2020" max="2099">
                </div>
              </div>
              <div class="form-grupo">
                <label>Faturamento (R$)</label>
                <input type="number" id="fin-fat" step="0.01" min="0" placeholder="0,00" required>
              </div>
              <div class="form-grupo">
                <label>Custos (R$)</label>
                <input type="number" id="fin-cus" step="0.01" min="0" placeholder="0,00" required>
              </div>
              <div class="form-grupo">
                <label>Meta do Mês (R$)</label>
                <input type="number" id="fin-meta" step="0.01" min="0" placeholder="Meta personalizada">
                <span class="text-xs text-suave" id="meta-padrao-info">Meta sugerida: carregando...</span>
              </div>
              <!-- Margem calculada -->
              <div style="background:var(--fundo);padding:12px;border-radius:var(--radius);margin-bottom:16px">
                <div class="flex justify-between">
                  <span class="text-sm text-suave">Margem de Lucro</span>
                  <strong id="margem-calculada">—</strong>
                </div>
              </div>
              <button type="submit" class="btn btn-primario w-100" id="btn-salvar-fin">Salvar</button>
            </form>
          </div>

          <div class="card">
            <h3 class="card-titulo">Faturamento vs Meta</h3>
            <canvas id="grafico-fin" height="250"></canvas>
          </div>
        </div>

        <!-- Histórico -->
        <div class="card">
          <h3 class="card-titulo mb-3">Histórico</h3>
          <div class="tabela-container">
            <table id="tabela-historico">
              <thead>
                <tr>
                  <th>Mês/Ano</th>
                  <th>Faturamento</th>
                  <th>Custos</th>
                  <th>Margem</th>
                  <th>Meta</th>
                  <th>Atingiu</th>
                </tr>
              </thead>
              <tbody id="tbody-historico">
                <tr>
                  <td colspan="6" class="text-center text-suave">Carregando...</td>
                </tr>
              </tbody>
            </table>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="/assets/js/api.js"></script>
  <script src="/assets/js/auth.js"></script>
  <script src="/assets/js/sidebar-painel.js"></script>
  <script>
    const usuario = protegerPagina(['cliente']);
    let grafico = null;
    const mesesNome = ['Jan', 'Fev', 'Mar', 'Abr', 'Mai', 'Jun', 'Jul', 'Ago', 'Set', 'Out', 'Nov', 'Dez'];

    if (usuario) { inicializarLayout(); carregarFinanceiro(); }

    // Calcula margem em tempo real ao alterar inputs
    ['fin-fat', 'fin-cus'].forEach(id => {
      document.getElementById(id).addEventListener('input', () => {
        const fat = parseFloat(document.getElementById('fin-fat').value) || 0;
        const cus = parseFloat(document.getElementById('fin-cus').value) || 0;
        const margem = fat > 0 ? ((fat - cus) / fat * 100).toFixed(1) : 0;
        document.getElementById('margem-calculada').textContent = `${margem}%`;
        document.getElementById('margem-calculada').style.color = margem >= 0 ? 'var(--sucesso)' : 'var(--erro)';
      });
    });

    async function carregarFinanceiro() {
      try {
        const [{ historico }, { resumo }, { meta, mes_de_uso }] = await Promise.all([
          api.get('/financeiro-cliente'),
          api.get('/financeiro-cliente/resumo'),
          api.get('/financeiro-cliente/meta-padrao')
        ]);

        // Preenche meta padrão
        document.getElementById('meta-padrao-info').textContent = `Meta sugerida para mês ${mes_de_uso}: ${formatarMoeda(meta)}`;
        if (!document.getElementById('fin-meta').value) {
          document.getElementById('fin-meta').value = meta;
        }

        // Indicadores
        if (resumo) {
          document.getElementById('melhor-mes').textContent = formatarMoeda(resumo.melhorMes?.faturamento);
          document.getElementById('crescimento').textContent = resumo.crescimento !== null ? `${resumo.crescimento}%` : '—';
          document.getElementById('meta-status').textContent = resumo.metaAtingida === true ? '✅ Sim' : resumo.metaAtingida === false ? '❌ Não' : '—';
        }

        // Preenche formulário com último mês
        if (historico.length > 0) {
          const ultimo = historico[0];
          document.getElementById('fin-mes').value = ultimo.mes;
          document.getElementById('fin-ano').value = ultimo.ano;
          document.getElementById('fin-fat').value = ultimo.faturamento;
          document.getElementById('fin-cus').value = ultimo.custos;
          document.getElementById('fin-meta').value = ultimo.meta || '';
        }

        // Tabela histórico
        const tbody = document.getElementById('tbody-historico');
        tbody.innerHTML = historico.map(h => `
        <tr>
          <td>${mesesNome[h.mes - 1]}/${h.ano}</td>
          <td>${formatarMoeda(h.faturamento)}</td>
          <td>${formatarMoeda(h.custos)}</td>
          <td><span class="${h.margem_lucro >= 0 ? 'text-sucesso' : 'text-erro'}">${h.margem_lucro?.toFixed(1) || 0}%</span></td>
          <td>${h.meta ? formatarMoeda(h.meta) : '—'}</td>
          <td>${h.meta ? (h.faturamento >= h.meta ? '✅' : '❌') : '—'}</td>
        </tr>`).join('') || '<tr><td colspan="6" class="text-center text-suave">Nenhum dado</td></tr>';

        // Gráfico
        const dados = historico.slice(0, 6).reverse();
        renderizarGrafico(dados);
      } catch (err) {
        console.error('Erro ao carregar financeiro:', err);
      }
    }

    function renderizarGrafico(dados) {
      const ctx = document.getElementById('grafico-fin').getContext('2d');
      if (grafico) grafico.destroy();
      grafico = new Chart(ctx, {
        type: 'bar',
        data: {
          labels: dados.map(d => `${mesesNome[d.mes - 1]}/${d.ano}`),
          datasets: [
            { label: 'Faturamento', data: dados.map(d => d.faturamento), backgroundColor: '#0f1e35', borderRadius: 6 },
            { label: 'Meta', data: dados.map(d => d.meta || 0), backgroundColor: '#c8a96e', borderRadius: 6, borderDash: [5, 5] }
          ]
        },
        options: { responsive: true, plugins: { legend: { position: 'bottom' } }, scales: { y: { beginAtZero: true, ticks: { callback: v => 'R$' + v.toLocaleString('pt-BR') } } } }
      });
    }

    async function salvarLancamento(e) {
      e.preventDefault();
      const btn = document.getElementById('btn-salvar-fin');
      btn.disabled = true; btn.textContent = 'Salvando...';
      try {
        await api.post('/financeiro-cliente', {
          mes: document.getElementById('fin-mes').value,
          ano: document.getElementById('fin-ano').value,
          faturamento: document.getElementById('fin-fat').value,
          custos: document.getElementById('fin-cus').value,
          meta: document.getElementById('fin-meta').value || null
        });
        mostrarAlerta('Lançamento salvo com sucesso!');
        carregarFinanceiro();
      } catch (err) {
        mostrarAlerta(err.erro || 'Erro ao salvar', 'erro');
      }
      btn.disabled = false; btn.textContent = 'Salvar';
    }
  </script>
      </div><!-- /pagina -->
    </main><!-- /app-content -->
  </div><!-- /app-layout -->

</html>
