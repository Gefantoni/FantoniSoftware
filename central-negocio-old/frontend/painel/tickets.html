<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Atendimento — Central do Negócio</title>
  <script src="https://unpkg.com/@phosphor-icons/web"></script>
  <link rel="stylesheet" href="/assets/css/global.css">
  <link rel="stylesheet" href="/assets/css/painel.css">
  <style>
    /* ===== LAYOUT ===== */
    .at-grid {
      display: grid;
      grid-template-columns: 320px 1fr;
      gap: 20px;
      height: calc(100vh - 180px);
    }

    /* ===== PAINEL ESQUERDO ===== */
    .at-list-panel {
      background: var(--fundo-card);
      border: 1px solid var(--borda);
      border-radius: 16px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .at-list-header {
      padding: 16px 20px;
      border-bottom: 1px solid var(--borda);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .at-list-header h4 {
      font-size: 14px;
      font-weight: 600;
      color: var(--texto);
      margin: 0;
    }
    .at-list-scroll { flex: 1; overflow-y: auto; }

    .at-item {
      padding: 14px 18px;
      border-bottom: 1px solid var(--borda);
      cursor: pointer;
      transition: background 0.15s;
      border-left: 3px solid transparent;
    }
    .at-item:last-child { border-bottom: none; }
    .at-item:hover { background: rgba(255,255,255,0.03); }
    .at-item.ativo {
      background: rgba(59,130,246,0.08);
      border-left-color: var(--primaria);
    }
    .at-item-titulo {
      font-size: 13px;
      font-weight: 600;
      color: var(--texto);
      margin-bottom: 6px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .at-item-meta {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }
    .at-item-cat {
      font-size: 11px;
      color: var(--texto-muted);
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    /* ===== PAINEL DIREITO ===== */
    .at-chat-panel {
      background: var(--fundo-card);
      border: 1px solid var(--borda);
      border-radius: 16px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .at-chat-empty {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      opacity: 0.3;
      text-align: center;
      padding: 40px;
      gap: 12px;
    }
    .at-chat-empty i { font-size: 64px; }
    .at-chat-empty h3 { font-size: 16px; color: var(--texto); }
    .at-chat-empty p { font-size: 13px; color: var(--texto-suave); }

    /* chat ativo */
    .at-chat-header {
      padding: 16px 20px;
      border-bottom: 1px solid var(--borda);
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-shrink: 0;
    }
    .at-chat-header h3 { font-size: 15px; color: var(--texto); margin: 0 0 4px; }
    .at-chat-header-meta { display: flex; align-items: center; gap: 10px; }

    .at-msgs {
      flex: 1;
      overflow-y: auto;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .msg-linha {
      display: flex;
      flex-direction: column;
    }
    .msg-linha.minha { align-items: flex-end; }
    .msg-linha.deles  { align-items: flex-start; }

    .msg-balao {
      max-width: 72%;
      padding: 10px 14px;
      border-radius: 14px;
      font-size: 13px;
      line-height: 1.6;
    }
    .msg-linha.minha .msg-balao {
      background: var(--primaria);
      color: #fff;
      border-bottom-right-radius: 4px;
    }
    .msg-linha.deles .msg-balao {
      background: rgba(255,255,255,0.06);
      color: var(--texto);
      border-bottom-left-radius: 4px;
    }
    .msg-hora {
      font-size: 10px;
      color: var(--texto-muted);
      margin-top: 4px;
      padding: 0 4px;
    }
    .msg-aguardando {
      text-align: center;
      padding: 32px;
      font-size: 13px;
      color: var(--texto-muted);
    }

    /* input */
    .at-input-area {
      padding: 16px 20px;
      border-top: 1px solid var(--borda);
      flex-shrink: 0;
    }
    .at-input-box {
      background: rgba(255,255,255,0.04);
      border: 1px solid var(--borda);
      border-radius: 14px;
      padding: 10px 12px;
      display: flex;
      align-items: flex-end;
      gap: 10px;
      transition: border-color 0.2s;
    }
    .at-input-box:focus-within { border-color: rgba(59,130,246,0.4); }
    .at-textarea {
      flex: 1;
      background: transparent;
      border: none;
      color: var(--texto);
      outline: none;
      resize: none;
      font-family: inherit;
      font-size: 14px;
      padding: 4px 0;
      max-height: 120px;
    }
    .at-textarea::placeholder { color: var(--texto-muted); }
    .at-btn-icon {
      width: 34px; height: 34px;
      border-radius: 50%;
      background: transparent;
      border: 1px solid var(--borda);
      color: var(--texto-muted);
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      transition: all 0.2s;
      flex-shrink: 0;
      font-size: 17px;
    }
    .at-btn-icon:hover { background: rgba(255,255,255,0.06); color: var(--texto); }
    .at-btn-send {
      width: 36px; height: 36px;
      border-radius: 50%;
      background: var(--primaria);
      border: none;
      color: #fff;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      transition: all 0.2s;
      flex-shrink: 0;
    }
    .at-btn-send:hover { background: #2563eb; transform: scale(1.05); }
    .at-btn-send:disabled { opacity: 0.5; cursor: default; transform: none; }

    /* preview de imagem antes de enviar */
    .img-preview-wrap {
      display: none;
      align-items: center;
      gap: 10px;
      padding: 8px 12px;
      background: rgba(59,130,246,0.08);
      border: 1px solid rgba(59,130,246,0.2);
      border-radius: 10px;
      margin-bottom: 10px;
    }
    .img-preview-wrap.visivel { display: flex; }
    .img-preview-wrap img { height: 48px; width: 48px; object-fit: cover; border-radius: 6px; }
    .img-preview-nome { font-size: 12px; color: var(--texto-suave); flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .img-preview-remove { background: none; border: none; color: var(--texto-muted); cursor: pointer; font-size: 18px; }

    /* mensagem enviando (otimista) */
    .msg-linha.enviando { opacity: 0.5; }

    /* badge status */
    .badge-status {
      font-size: 11px;
      font-weight: 600;
      padding: 3px 10px;
      border-radius: 99px;
    }
    .st-aberto     { background: rgba(59,130,246,0.1); color: #93c5fd; }
    .st-aceito     { background: rgba(245,158,11,0.1); color: #fcd34d; }
    .st-andamento  { background: rgba(245,158,11,0.12); color: #fcd34d; }
    .st-resolvido  { background: rgba(16,185,129,0.1); color: #6ee7b7; }

    /* tela vazia */
    .at-empty-list {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 40px 24px;
      gap: 10px;
      opacity: 0.5;
    }

    /* visibilidade */
    .oculto { display: none !important; }

    /* ===== MOBILE ===== */
    @media (max-width: 900px) {
      .at-grid {
        grid-template-columns: 1fr;
        height: auto;
      }
      .at-list-panel { height: 320px; }
      .at-chat-panel { height: calc(100vh - 400px); min-height: 360px; }
    }
  </style>
</head>
<body>
  <div class="app-layout">
    <aside class="app-sidebar" id="sidebar"></aside>
    <main class="app-content">
      <header class="app-header" id="topbar"></header>
      <div class="app-body">

        <!-- Cabeçalho da página -->
        <div style="display:flex; align-items:center; justify-content:space-between; margin-bottom:24px; flex-wrap:wrap; gap:12px">
          <div>
            <h2 style="font-size:18px; color:var(--texto); margin:0 0 4px">Atendimento</h2>
            <p style="font-size:13px; color:var(--texto-suave); margin:0">Abra chamados e acompanhe seu atendimento em tempo real.</p>
          </div>
          <button class="btn btn-primario btn-sm" onclick="abrirModal()">
            <i class="ph ph-plus"></i> Abrir chamado
          </button>
        </div>

        <!-- Grid principal -->
        <div class="at-grid">

          <!-- Lista de chamados -->
          <div class="at-list-panel">
            <div class="at-list-header">
              <h4><i class="ph ph-list-bullets" style="margin-right:6px"></i>Seus chamados</h4>
              <span id="badge-total" class="badge badge-azul" style="display:none"></span>
            </div>
            <div class="at-list-scroll" id="lista-tickets">
              <div class="at-empty-list">
                <i class="ph ph-spinner" style="font-size:32px"></i>
                <p>Carregando...</p>
              </div>
            </div>
          </div>

          <!-- Área de chat -->
          <div class="at-chat-panel" id="chat-panel">
            <!-- Estado vazio (padrão) -->
            <div class="at-chat-empty" id="chat-vazio">
              <i class="ph ph-chats"></i>
              <h3>Nenhum chamado selecionado</h3>
              <p>Selecione um chamado ao lado ou abra um novo.</p>
            </div>

            <!-- Chat ativo (oculto por padrão) -->
            <div id="chat-ativo" class="oculto" style="display:flex; flex-direction:column; height:100%; overflow:hidden">
              <div class="at-chat-header">
                <div>
                  <h3 id="chat-titulo">—</h3>
                  <div class="at-chat-header-meta">
                    <span class="badge-status" id="chat-status-badge">—</span>
                    <span style="font-size:11px; color:var(--texto-muted)" id="chat-id-label">#000</span>
                  </div>
                </div>
                <button class="btn btn-outline btn-sm" onclick="fecharChat()">
                  <i class="ph ph-arrow-left"></i> Voltar
                </button>
              </div>

              <div class="at-msgs" id="chat-msgs"></div>

              <div class="at-input-area">
                <!-- Preview da imagem selecionada -->
                <div class="img-preview-wrap" id="img-preview-wrap">
                  <img id="img-preview-thumb" src="" alt="">
                  <span class="img-preview-nome" id="img-preview-nome"></span>
                  <button class="img-preview-remove" onclick="cancelarImagem()" title="Remover"><i class="ph ph-x"></i></button>
                </div>

                <div class="at-input-box">
                  <!-- Botão de imagem -->
                  <button class="at-btn-icon" onclick="document.getElementById('file-imagem').click()" title="Enviar imagem">
                    <i class="ph ph-image"></i>
                  </button>
                  <input type="file" id="file-imagem" accept="image/jpeg,image/png,image/gif,image/webp" style="display:none" onchange="selecionarImagem(event)">

                  <textarea
                    id="chat-input"
                    class="at-textarea"
                    placeholder="Digite sua mensagem..."
                    rows="1"
                    oninput="this.style.height='auto';this.style.height=this.scrollHeight+'px'"
                    onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();enviar()}"
                  ></textarea>
                  <button class="at-btn-send" id="btn-send" onclick="enviar()">
                    <i class="ph ph-paper-plane-tilt"></i>
                  </button>
                </div>
              </div>
            </div>
          </div>

        </div>
      </div>
    </main>
  </div>

  <!-- Modal novo chamado -->
  <div id="modal-novo" style="display:none; position:fixed; inset:0; background:rgba(2,6,23,0.8); backdrop-filter:blur(8px); z-index:1000; align-items:center; justify-content:center; padding:20px">
    <div style="background:#18181b; border:1px solid var(--borda); border-radius:20px; padding:32px; width:100%; max-width:480px">
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:24px">
        <h3 style="font-size:17px; color:var(--texto); margin:0">Abrir Chamado</h3>
        <button onclick="fecharModal()" style="background:none; border:none; color:var(--texto-muted); cursor:pointer; font-size:20px"><i class="ph ph-x"></i></button>
      </div>

      <div class="form-grupo">
        <label style="display:block; font-size:12px; font-weight:600; color:var(--texto-suave); text-transform:uppercase; letter-spacing:.05em; margin-bottom:8px">Assunto</label>
        <input type="text" id="tk-titulo" class="form-input" placeholder="Ex: Erro ao emitir NFC-e">
      </div>

      <div class="form-grupo" style="margin-top:16px">
        <label style="display:block; font-size:12px; font-weight:600; color:var(--texto-suave); text-transform:uppercase; letter-spacing:.05em; margin-bottom:8px">Departamento</label>
        <select id="tk-categoria" class="form-input">
          <option value="suporte">Suporte Técnico</option>
          <option value="financeiro">Financeiro / Pagamentos</option>
          <option value="comercial">Comercial / Planos</option>
        </select>
      </div>

      <div class="form-grupo" style="margin-top:16px">
        <label style="display:block; font-size:12px; font-weight:600; color:var(--texto-suave); text-transform:uppercase; letter-spacing:.05em; margin-bottom:8px">Descrição</label>
        <textarea id="tk-descricao" class="form-input" rows="4" placeholder="Descreva o que está acontecendo..."></textarea>
      </div>

      <div style="display:flex; gap:12px; margin-top:24px">
        <button class="btn btn-outline" style="flex:1" onclick="fecharModal()">Cancelar</button>
        <button class="btn btn-primario" style="flex:1" onclick="criarTicket()" id="btn-criar">
          <i class="ph ph-paper-plane-tilt"></i> Enviar
        </button>
      </div>
    </div>
  </div>

  <script src="/assets/js/api.js"></script>
  <script src="/assets/js/auth.js"></script>
  <script src="/assets/js/sidebar-painel.js"></script>
  <script>
    const usuario = protegerPagina(['cliente']);
    let ticketAtivo = null;
    let pollingInterval = null;
    let ultimoMsgCount = 0;      // para polling inteligente
    let imagemSelecionada = null; // arquivo de imagem pendente

    if (usuario) carregarTickets();

    // ===== LISTA =====
    async function carregarTickets() {
      try {
        const { tickets } = await api.get('/tickets');
        const lista = document.getElementById('lista-tickets');
        const badge = document.getElementById('badge-total');

        if (!tickets.length) {
          lista.innerHTML = `
            <div class="at-empty-list">
              <i class="ph ph-ticket" style="font-size:36px;margin-bottom:8px"></i>
              <p style="font-size:13px">Nenhum chamado aberto ainda.</p>
            </div>`;
          badge.style.display = 'none';
          return;
        }

        badge.textContent = tickets.length;
        badge.style.display = 'inline-flex';

        lista.innerHTML = tickets.map(t => `
          <div class="at-item ${ticketAtivo === t.id ? 'ativo' : ''}" onclick="selecionarTicket(${t.id})">
            <div class="at-item-titulo">${escapeHtml(t.titulo)}</div>
            <div class="at-item-meta">
              <span class="at-item-cat">${t.categoria}</span>
              <span class="badge-status ${statusClass(t.status)}">${statusLabel(t.status)}</span>
            </div>
          </div>`).join('');

        // Atualiza badge do header do chat se ticket ativo mudou de status
        if (ticketAtivo) {
          const t = tickets.find(x => x.id === ticketAtivo);
          if (t) atualizarHeaderChat(t);
        }
      } catch (err) {
        console.error('Erro ao carregar tickets:', err);
      }
    }

    // ===== SELECIONAR TICKET =====
    async function selecionarTicket(id) {
      ticketAtivo = id;
      ultimoMsgCount = 0;

      document.getElementById('chat-vazio').style.display = 'none';
      const chatAtivo = document.getElementById('chat-ativo');
      chatAtivo.classList.remove('oculto');
      chatAtivo.style.display = 'flex';

      carregarTickets();

      try {
        const { tickets } = await api.get('/tickets');
        const t = tickets.find(x => x.id === id);
        if (!t) return;
        atualizarHeaderChat(t);
        await carregarMensagens();

        // Polling rápido: 2s quando chat está aberto
        if (pollingInterval) clearInterval(pollingInterval);
        pollingInterval = setInterval(async () => {
          await carregarMensagens();
          carregarTickets(); // atualiza status na lista
        }, 2000);
      } catch (err) {
        console.error('Erro ao abrir ticket:', err);
      }
    }

    function atualizarHeaderChat(t) {
      document.getElementById('chat-titulo').textContent = t.titulo;
      document.getElementById('chat-id-label').textContent = `#${t.id}`;
      const badge = document.getElementById('chat-status-badge');
      badge.textContent = statusLabel(t.status);
      badge.className = 'badge-status ' + statusClass(t.status);
    }

    // ===== MENSAGENS =====
    async function carregarMensagens() {
      if (!ticketAtivo) return;
      try {
        const { mensagens } = await api.get(`/tickets/${ticketAtivo}/mensagens`);

        // Só re-renderiza se houver mensagens novas
        if (mensagens.length === ultimoMsgCount) return;
        ultimoMsgCount = mensagens.length;

        const container = document.getElementById('chat-msgs');
        const estavaNoBaixo = container.scrollTop + container.clientHeight >= container.scrollHeight - 40;

        if (!mensagens.length) {
          container.innerHTML = '<div class="msg-aguardando"><i class="ph ph-hourglass" style="font-size:24px;display:block;margin-bottom:8px;opacity:.4"></i>Aguardando atendimento...</div>';
          return;
        }

        const meuId = String(usuario.id);
        container.innerHTML = mensagens.map(m => {
          const minha = String(m.autor_id) === meuId;
          const hora = new Date(m.criado_em).toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' });
          let conteudo;
          if (m.tipo === 'imagem') {
            const url = escapeHtml(m.conteudo);
            conteudo = `<img src="${url}" style="max-width:220px;border-radius:8px;cursor:pointer;display:block" onclick="window.open('${url}','_blank')" loading="lazy">`;
          } else {
            conteudo = escapeHtml(m.conteudo);
          }
          return `
            <div class="msg-linha ${minha ? 'minha' : 'deles'}">
              <div class="msg-balao">${conteudo}</div>
              <span class="msg-hora">${hora}</span>
            </div>`;
        }).join('');

        // Só scrolla se o usuário estava no fundo
        if (estavaNoBaixo) container.scrollTop = container.scrollHeight;
      } catch (err) {
        console.error('Erro ao carregar mensagens:', err);
      }
    }

    // ===== ENVIO (texto ou imagem) =====
    async function enviar() {
      if (!ticketAtivo) return;
      if (imagemSelecionada) {
        await enviarImagem();
      } else {
        await enviarTexto();
      }
    }

    async function enviarTexto() {
      const input = document.getElementById('chat-input');
      const texto = input.value.trim();
      if (!texto) return;

      input.value = '';
      input.style.height = 'auto';
      setBtnSend(true);

      // UI otimista
      adicionarMsgOtimista(texto, 'texto');

      try {
        await api.post(`/tickets/${ticketAtivo}/mensagens`, { conteudo: texto });
        ultimoMsgCount = 0; // força refresh
        await carregarMensagens();
      } catch (err) {
        console.error('Erro ao enviar mensagem:', err);
      } finally {
        setBtnSend(false);
      }
    }

    async function enviarImagem() {
      if (!imagemSelecionada || !ticketAtivo) return;
      setBtnSend(true);

      const formData = new FormData();
      formData.append('arquivo', imagemSelecionada);
      formData.append('ticket_id', ticketAtivo);

      cancelarImagem();

      try {
        await api.upload('/upload/chat', formData);
        ultimoMsgCount = 0;
        await carregarMensagens();
      } catch (err) {
        console.error('Erro ao enviar imagem:', err);
        mostrarAlerta('Erro ao enviar imagem. Tente novamente.', 'erro');
      } finally {
        setBtnSend(false);
      }
    }

    // ===== UI DE IMAGEM =====
    function selecionarImagem(event) {
      const file = event.target.files[0];
      if (!file) return;
      imagemSelecionada = file;

      const reader = new FileReader();
      reader.onload = e => {
        document.getElementById('img-preview-thumb').src = e.target.result;
        document.getElementById('img-preview-nome').textContent = file.name;
        document.getElementById('img-preview-wrap').classList.add('visivel');
        document.getElementById('chat-input').placeholder = 'Clique em enviar para mandar a imagem...';
      };
      reader.readAsDataURL(file);
      event.target.value = ''; // reseta input
    }

    function cancelarImagem() {
      imagemSelecionada = null;
      document.getElementById('img-preview-wrap').classList.remove('visivel');
      document.getElementById('img-preview-thumb').src = '';
      document.getElementById('chat-input').placeholder = 'Digite sua mensagem...';
    }

    // UI otimista — adiciona mensagem localmente antes do servidor confirmar
    function adicionarMsgOtimista(texto, tipo) {
      const container = document.getElementById('chat-msgs');
      const hora = new Date().toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' });
      const div = document.createElement('div');
      div.className = 'msg-linha minha enviando';
      div.innerHTML = `
        <div class="msg-balao">${escapeHtml(texto)}</div>
        <span class="msg-hora">${hora}</span>`;
      container.appendChild(div);
      container.scrollTop = container.scrollHeight;
    }

    function setBtnSend(disabled) {
      document.getElementById('btn-send').disabled = disabled;
    }

    function fecharChat() {
      ticketAtivo = null;
      ultimoMsgCount = 0;
      if (pollingInterval) clearInterval(pollingInterval);
      cancelarImagem();
      document.getElementById('chat-ativo').classList.add('oculto');
      document.getElementById('chat-ativo').style.display = '';
      document.getElementById('chat-vazio').style.display = '';
      carregarTickets();
    }

    // ===== MODAL =====
    function abrirModal() { document.getElementById('modal-novo').style.display = 'flex'; }
    function fecharModal() {
      document.getElementById('modal-novo').style.display = 'none';
      document.getElementById('tk-titulo').value = '';
      document.getElementById('tk-descricao').value = '';
    }

    async function criarTicket() {
      const titulo    = document.getElementById('tk-titulo').value.trim();
      const categoria = document.getElementById('tk-categoria').value;
      const descricao = document.getElementById('tk-descricao').value.trim();
      if (!titulo || !descricao) { alert('Preencha o assunto e a descrição.'); return; }

      const btn = document.getElementById('btn-criar');
      btn.disabled = true;
      btn.innerHTML = '<i class="ph ph-spinner"></i> Enviando...';

      try {
        const { ticket } = await api.post('/tickets', { titulo, categoria, descricao });
        fecharModal();
        await carregarTickets();
        if (ticket?.id) selecionarTicket(ticket.id);
      } catch (err) {
        alert('Erro ao criar chamado. Tente novamente.');
      } finally {
        btn.disabled = false;
        btn.innerHTML = '<i class="ph ph-paper-plane-tilt"></i> Enviar';
      }
    }

    // ===== UTILITÁRIOS =====
    function statusLabel(s) {
      return { aberto: 'Aberto', aceito: 'Aceito', em_andamento: 'Em atendimento', resolvido: 'Resolvido' }[s] || s;
    }
    function statusClass(s) {
      return { aberto: 'st-aberto', aceito: 'st-aceito', em_andamento: 'st-andamento', resolvido: 'st-resolvido' }[s] || 'st-aberto';
    }
    function escapeHtml(str) {
      if (!str) return '';
      return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/\n/g,'<br>');
    }
  </script>
</body>
</html>
