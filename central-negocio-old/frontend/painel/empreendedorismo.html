<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Escola do Empreendedor — Central do Negócio</title>
  <script src="https://unpkg.com/@phosphor-icons/web"></script>
  <link rel="stylesheet" href="/assets/css/global.css">
  <link rel="stylesheet" href="/assets/css/painel.css">
  <style>
    .emp-hero {
      background: linear-gradient(135deg, rgba(59, 130, 246, 0.15) 0%, rgba(9, 9, 11, 0) 100%);
      border: 1px solid var(--borda); border-radius: 24px; padding: 60px 40px; margin-bottom: 32px;
      position: relative; overflow: hidden; display: flex; align-items: center; justify-content: space-between;
    }
    .hero-content { position: relative; z-index: 2; max-width: 600px; }
    .hero-visual { position: absolute; right: 0; top: 0; height: 100%; opacity: 0.1; pointer-events: none; }
    
    .pillars-container { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 20px; margin-bottom: 40px; }
    .pillar-card {
      background: var(--fundo-card); border: 1px solid var(--borda); border-radius: 20px; padding: 24px;
      cursor: pointer; transition: var(--transicao); position: relative; overflow: hidden;
    }
    .pillar-card:hover { border-color: var(--primaria); transform: translateY(-5px); box-shadow: var(--sombra); }
    .pillar-card.active { border-color: var(--primaria); background: rgba(59, 130, 246, 0.05); }
    .pillar-card i { font-size: 32px; color: var(--primaria); margin-bottom: 16px; display: block; }
    
    .lesson-item { background: rgba(255,255,255,0.02); border: 1px solid var(--borda); border-radius: 14px; margin-bottom: 12px; transition: 0.2s; }
    .lesson-item:hover { background: rgba(255,255,255,0.04); border-color: rgba(255,255,255,0.2); }
    .lesson-item.done { border-color: rgba(16,185,129,0.2); }
    
    .lesson-header { 
        width: 100%; display: flex; align-items: center; gap: 16px; padding: 16px 20px; 
        background: none; border: none; cursor: pointer; text-align: left;
    }
    .check-box { 
        width: 24px; height: 24px; border-radius: 50%; border: 2px solid var(--borda); 
        display: flex; items-center; justify-content: center; font-size: 12px; color: transparent;
    }
    .lesson-item.done .check-box { background: var(--sucesso); border-color: var(--sucesso); color: #fff; }
    
    .lesson-body { display: none; padding: 24px; border-top: 1px solid var(--borda); background: rgba(0,0,0,0.2); }
    .lesson-body.show { display: block; animation: slideIn 0.3s ease; }

    @keyframes slideIn { from { opacity: 0; transform: translateY(-10px); } to { opacity: 1; transform: translateY(0); } }
  </style>
</head>
<body>
  <div class="app-layout">
    <aside class="app-sidebar" id="sidebar"></aside>

    <main class="app-content">
      <header class="app-header"></header>

      <div class="app-body">
        
        <div class="emp-hero">
          <div class="hero-content">
            <h1 class="text-white text-4xl mb-2">Escola do Empreendedor</h1>
            <p class="text-suave text-lg">Mentoria técnica e estratégica para transformar sua operação gastronômica em uma máquina de lucro.</p>
            
            <div class="flex items-center gap-4 mt-8">
               <div style="flex:1">
                  <div class="flex justify-between text-[10px] uppercase text-suave mb-2">
                     <span>Progresso na Trilha</span>
                     <span id="txt-percent">0%</span>
                  </div>
                  <div class="progress-minimal" style="height:4px">
                     <div class="progress-minimal-fill" id="bar-percent" style="width:0%"></div>
                  </div>
               </div>
               <div class="badge badge-azul" id="txt-count">0 / 20</div>
            </div>
          </div>
          <i class="ph ph-cooking-pot hero-visual" style="font-size: 200px"></i>
        </div>

        <div class="flex items-center gap-2 mb-6">
           <i class="ph ph-compass text-primaria"></i>
           <h3 class="text-white m-0">Pilares de Gestão</h3>
        </div>

        <div class="pillars-container" id="pillars-el">
           <!-- Gerado via JS -->
        </div>

        <div id="lessons-el">
           <div class="p-12 text-center text-suave opacity-50 border-2 border-dashed border-white/5 rounded-3xl">
              <i class="ph ph-cursor-click scale-150 mb-4 block"></i>
              Selecione um pilar acima para visualizar os conteúdos.
           </div>
        </div>

      </div>
    </main>
  </div>

  <script src="/assets/js/api.js"></script>
  <script src="/assets/js/auth.js"></script>
  <script src="/assets/js/sidebar-painel.js"></script>
  <script>
    const PILARES = [
      { id: 'financas', icon: 'ph-money', title: 'Inteligência Financeira', desc: 'CMV, Precificação e DRE.', lessons: [
        { id: 101, title: 'CMV: O Indicador de Ouro', content: 'Descubra como calcular seu custo de mercadoria real e manter abaixo de 30%.' },
        { id: 102, title: 'Engenharia de Cardápio', content: 'Aplique a matriz BCG para identificar seus pratos Estrela e Cachorro.' },
        { id: 103, title: 'Fluxo de Caixa Diário', content: 'Como nunca mais ficar sem capital de giro em datas críticas.' }
      ]},
      { id: 'operacao', icon: 'ph-cooking-pot', title: 'Eficiência Operacional', desc: 'Fichas técnicas e processos.', lessons: [
        { id: 201, title: 'Ficha Técnica Digital', content: 'Padronize sua produção para garantir qualidade e margem constante.' },
        { id: 202, title: 'Gestão de Estoque Inteligente', content: 'Evite o desperdício que drena seu lucro mensal.' }
      ]},
      { id: 'marketing', icon: 'ph-megaphone', title: 'Marketing Gastronômico', desc: 'iFood, Tráfego e Instagram.', lessons: [
        { id: 301, title: 'Otimização de iFood', content: 'Como subir no ranking e vender mais sem pagar taxas abusivas.' },
        { id: 302, title: 'Fotos que Vendem', content: 'Técnicas básicas de fotografia mobile para pratos famintos.' }
      ]}
    ];

    const usuario = protegerPagina(['cliente']);
    let done = JSON.parse(localStorage.getItem('emp_v3_progress') || '[]');

    if(usuario) {
        renderPillars();
        updateBar();
    }

    function renderPillars() {
        const el = document.getElementById('pillars-el');
        el.innerHTML = PILARES.map(p => `
            <div class="pillar-card" id="p-card-${p.id}" onclick="selectPillar('${p.id}')">
                <i class="ph ${p.icon}"></i>
                <h4 class="text-white mb-2">${p.title}</h4>
                <p class="text-xs text-suave">${p.desc}</p>
            </div>
        `).join('');
    }

    function selectPillar(id) {
        document.querySelectorAll('.pillar-card').forEach(c => c.classList.remove('active'));
        document.getElementById(`p-card-${id}`).classList.add('active');
        
        const p = PILARES.find(x => x.id === id);
        const el = document.getElementById('lessons-el');
        el.innerHTML = `
            <div class="flex items-center gap-2 mb-4 mt-8">
                <span class="text-xs text-primaria fw-700 uppercase">Trilha selecionada:</span>
                <span class="text-white fw-600">${p.title}</span>
            </div>
            ${p.lessons.map(l => `
                <div class="lesson-item ${done.includes(l.id) ? 'done' : ''}" id="l-item-${l.id}">
                    <button class="lesson-header" onclick="toggle(${l.id})">
                        <div class="check-box"><i class="ph ph-check-bold"></i></div>
                        <span class="text-white text-sm fw-600 flex-1">${l.title}</span>
                        <i class="ph ph-caret-down text-suave"></i>
                    </button>
                    <div class="lesson-body" id="l-body-${l.id}">
                        <div class="text-suave text-sm leading-relaxed mb-6">${l.content}</div>
                        <button class="btn btn-primario btn-sm" onclick="mark(${l.id})">
                             ${done.includes(l.id) ? 'Concluído' : 'Confirmar Leitura'}
                        </button>
                    </div>
                </div>
            `).join('')}
        `;
    }

    function toggle(id) {
        const body = document.getElementById(`l-body-${id}`);
        const open = body.classList.contains('show');
        document.querySelectorAll('.lesson-body').forEach(b => b.classList.remove('show'));
        if(!open) body.classList.add('show');
    }

    function mark(id) {
        if(!done.includes(id)) {
            done.push(id);
            localStorage.setItem('emp_v3_progress', JSON.stringify(done));
            document.getElementById(`l-item-${id}`).classList.add('done');
            updateBar();
        }
        toggle(id);
    }

    function updateBar() {
        const total = 20; 
        const pct = Math.min(100, (done.length / total * 100)).toFixed(0);
        document.getElementById('txt-percent').textContent = pct + '%';
        document.getElementById('bar-percent').style.width = pct + '%';
        document.getElementById('txt-count').textContent = `${done.length} / ${total}`;
    }
  </script>
</body>
</html>
