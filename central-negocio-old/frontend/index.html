<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Central do Negócio — Fantoni Software</title>
  <script src="https://unpkg.com/@phosphor-icons/web"></script>
  <link rel="stylesheet" href="/assets/css/global.css">
  <style>
    body { 
      background: radial-gradient(circle at top left, #0f172a, #020617);
      display: flex; align-items: center; justify-content: center; min-height: 100vh; 
      font-family: 'Inter', sans-serif;
    }
    .login-container { width: 100%; max-width: 440px; padding: 24px; animation: fadeIn 0.8s ease; }
    .login-card { 
      background: rgba(15, 23, 42, 0.4); 
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-radius: 28px; 
      padding: 56px 48px; 
      border: 1px solid rgba(255,255,255,0.08);
      box-shadow: 0 40px 100px -20px rgba(0, 0, 0, 0.7); 
    }
    .login-logo { text-align: center; margin-bottom: 40px; }
    .login-logo h1 { font-family: 'Outfit', sans-serif; font-size: 28px; color: #fff; margin-top: 20px; letter-spacing: -0.02em; }
    .login-logo p { color: var(--texto-suave); font-size: 14px; margin-top: 8px; opacity: 0.7; }
    
    .login-divider { border: none; border-top: 1px solid rgba(255,255,255,0.05); margin: 32px 0; }
    .login-rodape { text-align: center; font-size: 12px; color: var(--texto-suave); margin-top: 24px; opacity: 0.5; line-height: 1.6; }
    
    .input-wrapper { position: relative; margin-bottom: 20px; }
    .input-icon { position: absolute; left: 16px; top: 18px; color: var(--texto-suave); font-size: 20px; opacity: 0.4; }
    .login-input { 
        width: 100%; padding: 16px 16px 16px 48px; 
        background: rgba(0,0,0,0.2); border: 1px solid rgba(255,255,255,0.1); 
        border-radius: 14px; color: #fff; font-size: 14px; outline: none; transition: 0.3s;
    }
    .login-input:focus { border-color: var(--primaria); background: rgba(0,0,0,0.4); box-shadow: 0 0 0 4px rgba(59,130,246,0.1); }

    @keyframes fadeIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
  </style>
</head>
<body>
  <div class="login-container">
    <div class="login-card">
      <div class="login-logo">
        <img src="/assets/logo.png" alt="Fantoni Software" style="height:80px; width:auto; filter: drop-shadow(0 0 20px rgba(59, 130, 246, 0.4));">
        <h1>Central do Negócio</h1>
        <p>Gestão Inteligente Fantoni Software</p>
      </div>

      <div id="erro-login" class="alerta alerta-erro mb-6 hidden">
        <i class="ph-fill ph-warning-circle mr-2"></i>
        <span id="erro-msg">Email ou senha inválidos.</span>
      </div>

      <form id="form-login">
        <div class="form-grupo">
          <label class="text-[10px] uppercase text-suave fw-700 tracking-widest ml-1 mb-2 block">Acesso Restrito</label>
          <div class="input-wrapper">
            <i class="ph ph-envelope-simple input-icon"></i>
            <input type="email" id="email" class="login-input" placeholder="seuemail@empresa.com" required>
          </div>
          <div class="input-wrapper">
            <i class="ph ph-lock-simple input-icon"></i>
            <input type="password" id="senha" class="login-input" placeholder="••••••••" required>
          </div>
        </div>
        
        <button type="submit" class="btn btn-primario w-full btn-lg mt-4 h-14" id="btn-entrar">
           Conectar agora <i class="ph ph-arrow-right ml-2 opacity-50"></i>
        </button>
      </form>

      <hr class="login-divider">
      <p class="login-rodape">© 2024 Fantoni Software LTDA. <br>Todos os direitos reservados.</p>
    </div>
  </div>

  <script src="/assets/js/api.js"></script>
  <script src="/assets/js/auth.js"></script>
  <script>
    const usuarioLogado = getUsuario();
    if (usuarioLogado && getToken()) {
      window.location.href = usuarioLogado.role === 'cliente' ? '/painel/' : '/admin/';
    }

    document.getElementById('form-login').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('btn-entrar');
      const erroEl = document.getElementById('erro-login');
      const email = document.getElementById('email').value.trim();
      const senha = document.getElementById('senha').value;

      btn.disabled = true;
      btn.innerHTML = '<i class="ph ph-circle-notch ph-spin mr-2"></i> Autenticando...';
      erroEl.classList.add('hidden');

      try {
        const user = await fazerLogin(email, senha);
        window.location.href = user.role === 'cliente' ? '/painel/' : '/admin/';
      } catch (err) {
        erroEl.classList.remove('hidden');
        document.getElementById('erro-msg').textContent = err.erro || 'Credenciais inválidas.';
        btn.disabled = false;
        btn.innerHTML = 'Conectar agora <i class="ph ph-arrow-right ml-2 opacity-50"></i>';
      }
    });
  </script>
</body>
</html>
