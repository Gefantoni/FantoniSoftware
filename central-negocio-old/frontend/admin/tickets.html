<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tickets Admin — Central do Negócio</title>
  <script src="https://unpkg.com/@phosphor-icons/web"></script>
  <link rel="stylesheet" href="/assets/css/global.css">
  <link rel="stylesheet" href="/assets/css/painel.css">
  <style>
    .chat-container-admin {
      display: flex; flex-direction: column; height: 90vh; background: var(--fundo-card);
      border-radius: var(--radius-lg); overflow: hidden; border: 1px solid var(--borda);
    }
    .chat-header-admin {
      padding: 16px 24px; border-bottom: 1px solid var(--borda);
      background: rgba(255,255,255,0.02); display: flex; align-items: center; justify-content: space-between;
    }
    .chat-messages-admin {
      flex: 1; overflow-y: auto; padding: 24px; display: flex; flex-direction: column; gap: 16px;
      background: radial-gradient(circle at top right, rgba(59, 130, 246, 0.05), transparent);
    }
    .chat-footer-admin {
      padding: 16px 24px; border-top: 1px solid var(--borda);
      background: rgba(255,255,255,0.02); display: flex; gap: 12px; align-items: flex-end;
    }
    .ticket-row:hover { background: rgba(59, 130, 246, 0.03); cursor: pointer; }
    
    .status-dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; margin-right: 6px; }
    .status-aberto { background: #3b82f6; box-shadow: 0 0 10px rgba(59, 130, 246, 0.5); }
    .status-resolvido { background: #10b981; }

    .bolha-admin { max-width: 80%; padding: 12px 16px; border-radius: 12px; font-size: 14px; position: relative; }
    .bolha-admin.minha { align-self: flex-end; background: var(--primaria); color: #fff; border-bottom-right-radius: 2px; }
    .bolha-admin.cliente { align-self: flex-start; background: var(--borda); color: var(--texto); border-bottom-left-radius: 2px; }
  </style>
</head>
<body>
  <div class="app-layout">
    <aside class="app-sidebar" id="sidebar"></aside>

    <main class="app-content">
      <header class="app-header"></header>

      <div class="app-body">
        <div class="justify-between flex items-center mb-6">
          <div class="page-title">
            <h1>Gestão de Chamados</h1>
            <p class="text-suave">Atendimento ao cliente e resolução de tickets técnicos.</p>
          </div>
          <div id="badge-novos" class="badge badge-vermelho d-none">0 novos</div>
        </div>

        <div class="card mb-6" style="padding: 16px;">
          <div class="flex gap-3 flex-wrap">
            <div class="flex-1" style="min-width: 200px">
                <select id="filtro-status" class="form-control" onchange="carregarTickets()">
                    <option value="">Todos os status</option>
                    <option value="aberto">Aberto</option>
                    <option value="aceito">Aceito</option>
                    <option value="em_andamento">Em andamento</option>
                    <option value="resolvido">Resolvido</option>
                </select>
            </div>
            <div class="flex-1" style="min-width: 200px">
                <select id="filtro-cat" class="form-control" onchange="carregarTickets()">
                    <option value="">Todas categorias</option>
                    <option value="suporte">Suporte</option>
                    <option value="financeiro">Financeiro</option>
                    <option value="comercial">Comercial</option>
                </select>
            </div>
            <button class="btn btn-outline" onclick="carregarTickets()"><i class="ph ph-arrows-clockwise"></i></button>
          </div>
        </div>

        <div class="card">
          <div class="tabela-container">
            <table>
              <thead>
                <tr><th>Cliente</th><th>Título do Chamado</th><th>Categoria</th><th>Prioridade</th><th>Status</th><th>Ações</th></tr>
              </thead>
              <tbody id="tbody-tickets">
                <tr><td colspan="6" class="text-center py-6"><div class="spinner"></div></td></tr>
              </tbody>
            </table>
          </div>
        </div>
      </div>
    </main>
  </div>

  <!-- Modal Chat -->
  <div id="modal-chat" class="modal-overlay d-none">
    <div class="modal" style="max-width: 800px; padding: 0;">
        <div class="chat-container-admin">
            <div class="chat-header-admin">
                <div>
                    <h3 id="chat-titulo" class="text-white fw-700 m-0">Chat de Suporte</h3>
                    <div id="chat-info" class="text-xs text-suave mt-1">Carregando histórico...</div>
                </div>
                <div class="flex gap-2">
                    <select id="chat-status-sel" class="form-control" style="height: 36px; padding: 0 12px; font-size: 13px" onchange="mudarStatus()">
                        <option value="aceito">Aceito</option>
                        <option value="em_andamento">Em andamento</option>
                        <option value="resolvido">Finalizar</option>
                    </select>
                    <button class="btn btn-outline btn-sm" onclick="fecharChat()">✕</button>
                </div>
            </div>
            <div id="chat-msgs" class="chat-messages-admin"></div>
            <div id="preview-img-admin" class="d-none" style="padding: 12px 24px; background: rgba(255,255,255,0.02); border-top: 1px solid var(--borda)">
                <div style="position:relative; display:inline-block">
                    <img id="preview-img-el-admin" style="height:60px; border-radius:8px">
                    <button onclick="cancelarImagemAdmin()" style="position:absolute; top:-8px; right:-8px; background:var(--erro); color:#fff; border:none; border-radius:50%; width:20px; height:20px; font-size:10px">✕</button>
                </div>
            </div>
            <div class="chat-footer-admin">
                <label class="btn btn-outline" style="padding: 10px; cursor: pointer">
                    <i class="ph ph-image"></i>
                    <input type="file" id="input-img-admin" accept="image/*" class="d-none" onchange="selecionarImagemAdmin(event)">
                </label>
                <textarea id="chat-input" class="form-control" placeholder="Escreva sua resposta..." rows="1" style="resize:none" onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();enviarMensagem()}"></textarea>
                <button class="btn btn-primario" onclick="enviarMensagem()" id="btn-enviar-admin"><i class="ph ph-paper-plane-right"></i></button>
            </div>
        </div>
    </div>
  </div>

  <script src="/assets/js/api.js"></script>
  <script src="/assets/js/auth.js"></script>
  <script src="/assets/js/sidebar-admin.js"></script>
  <script>
    const usuario = protegerPagina(['admin','suporte']);
    let ticketAtual = null, pollingInterval = null, ultimaMensagemId = 0, ticketsCache = {};

    if (usuario) { inicializarLayout(); carregarTickets(); }

    async function carregarTickets() {
        const status = document.getElementById('filtro-status').value;
        const cat = document.getElementById('filtro-cat').value;
        try {
            const { tickets } = await api.get(`/tickets?status=${status}&categoria=${cat}`);
            renderizarTabela(tickets);
        } catch {}
    }

    function renderizarTabela(tickets) {
        const tbody = document.getElementById('tbody-tickets');
        if(!tickets.length) { tbody.innerHTML = '<tr><td colspan="6" class="text-center py-6 text-suave">Nenhum ticket encontrado.</td></tr>'; return; }
        
        tbody.innerHTML = tickets.map(t => {
            ticketsCache[t.id] = t;
            const priorityBadge = { urgente: 'badge-vermelho', normal: 'badge-azul', baixa: 'badge-cinza' };
            const statusBadge = { aberto: 'badge-azul', aceito: 'badge-amarelo', em_andamento: 'badge-amarelo', resolvido: 'badge-verde' };
            return `
            <tr class="ticket-row">
                <td><div class="fw-600 text-white">${t.perfis?.nome || '—'}</div></td>
                <td><div class="fw-500">${t.titulo}</div><div class="text-xs text-suave">${t.id}</div></td>
                <td><span class="text-xs uppercase fw-700 text-suave">${t.categoria}</span></td>
                <td><span class="badge ${priorityBadge[t.prioridade]}">${t.prioridade}</span></td>
                <td><span class="badge ${statusBadge[t.status]}">${t.status.replace('_',' ')}</span></td>
                <td>
                    <div class="flex gap-2">
                        ${t.status === 'aberto' ? `<button class="btn btn-primario btn-sm" onclick="aceitarTicket(${t.id})">Atender</button>` : ''}
                        ${['aceito','em_andamento'].includes(t.status) ? `<button class="btn btn-outline btn-sm" onclick="abrirChat(${t.id})"><i class="ph ph-chat-centered-text"></i></button>` : ''}
                        ${t.status === 'resolvido' ? `<button class="btn btn-outline btn-sm" onclick="abrirChat(${t.id})"><i class="ph ph-eye"></i></button>` : ''}
                    </div>
                </td>
            </tr>`;
        }).join('');
    }

    async function aceitarTicket(id) {
        try { await api.patch(`/tickets/${id}/aceitar`, {}); carregarTickets(); abrirChat(id); } catch { alert('Erro ao aceitar'); }
    }

    async function abrirChat(id) {
        ticketAtual = id; ultimaMensagemId = 0;
        const t = ticketsCache[id];
        document.getElementById('chat-titulo').textContent = t.titulo;
        document.getElementById('chat-info').textContent = `Falando com ${t.perfis?.nome}`;
        document.getElementById('chat-status-sel').value = t.status;
        document.getElementById('modal-chat').classList.remove('d-none');
        document.getElementById('chat-msgs').innerHTML = '<div class="spinner" style="margin:20px auto"></div>';
        await recarregarMensagens();
        if(!pollingInterval) pollingInterval = setInterval(verificarNovas, 4000);
    }

    function fecharChat() {
        document.getElementById('modal-chat').classList.add('d-none');
        clearInterval(pollingInterval); pollingInterval = null; ticketAtual = null;
    }

    async function recarregarMensagens() {
        try {
            const { mensagens } = await api.get(`/tickets/${ticketAtual}/mensagens`);
            const container = document.getElementById('chat-msgs'); container.innerHTML = '';
            mensagens.forEach(m => container.appendChild(renderBolha(m)));
            container.scrollTop = container.scrollHeight;
            if(mensagens.length) ultimaMensagemId = mensagens[mensagens.length - 1].id;
        } catch {}
    }

    async function verificarNovas() {
        if(!ticketAtual) return;
        try {
            const { mensagens } = await api.get(`/tickets/${ticketAtual}/mensagens`);
            const novas = mensagens.filter(m => m.id > ultimaMensagemId);
            if(novas.length) {
                const container = document.getElementById('chat-msgs');
                novas.forEach(m => container.appendChild(renderBolha(m)));
                container.scrollTop = container.scrollHeight;
                ultimaMensagemId = mensagens[mensagens.length - 1].id;
            }
        } catch {}
    }

    function renderBolha(m) {
        const minha = m.autor_id === getUsuario().id;
        const div = document.createElement('div');
        div.className = `bolha-admin ${minha?'minha':'cliente'}`;
        if(m.tipo === 'imagem') {
            const img = document.createElement('img'); img.src = m.conteudo; img.style.maxWidth = '100%'; img.style.borderRadius = '8px';
            img.onclick = () => window.open(m.conteudo, '_blank');
            div.appendChild(img);
        } else {
            div.textContent = m.conteudo;
        }
        return div;
    }

    async function enviarMensagem() {
        const input = document.getElementById('chat-input');
        const txt = input.value.trim(); if(!txt && !arquivoAdmin) return;
        try {
            if(arquivoAdmin) { await enviarImagem(); }
            else { await api.post(`/tickets/${ticketAtual}/mensagens`, { conteudo: txt }); }
            input.value = ''; recarregarMensagens();
        } catch { alert('Erro ao enviar'); }
    }

    let arquivoAdmin = null;
    function selecionarImagemAdmin(e) {
        arquivoAdmin = e.target.files[0];
        const r = new FileReader(); r.onload = ev => { document.getElementById('preview-img-el-admin').src = ev.target.result; document.getElementById('preview-img-admin').classList.remove('d-none'); };
        r.readAsDataURL(arquivoAdmin);
    }
    function cancelarImagemAdmin() { arquivoAdmin = null; document.getElementById('preview-img-admin').classList.add('d-none'); }

    async function enviarImagem() {
        const form = new FormData(); form.append('arquivo', arquivoAdmin); form.append('ticket_id', ticketAtual);
        const resp = await fetch('/api/upload/chat', { method:'POST', headers: { Authorization: `Bearer ${localStorage.getItem('cn_token')}` }, body: form });
        if(resp.ok) { cancelarImagemAdmin(); recarregarMensagens(); }
    }

    async function mudarStatus() {
        const s = document.getElementById('chat-status-sel').value;
        await api.patch(`/tickets/${ticketAtual}/status`, { status: s });
        carregarTickets();
    }
  </script>
</body>
</html>
