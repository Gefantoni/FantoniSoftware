<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pipeline de Vendas — Comercial — Central do Negócio</title>
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <link rel="stylesheet" href="/assets/css/global.css">
    <link rel="stylesheet" href="/assets/css/painel.css">
    <link rel="stylesheet" href="/assets/css/comercial.css">
    <style>
        .kanban-container {
            display: flex; gap: 16px; overflow-x: auto; padding-bottom: 24px;
            min-height: calc(100vh - 180px); padding-right: 24px;
        }
        .kanban-col {
            min-width: 280px; width: 280px; background: rgba(255,255,255,0.02);
            border: 1px solid var(--borda); border-radius: var(--radius-lg);
            display: flex; flex-direction: column; flex-shrink: 0;
        }
        .kanban-col-header {
            padding: 16px 20px; border-bottom: 2px solid var(--primaria);
            display: flex; justify-content: space-between; align-items: center;
            background: rgba(255,255,255,0.01); border-radius: 12px 12px 0 0;
        }
        .kanban-col-title { font-size: 13px; font-weight: 700; color: #fff; text-transform: uppercase; letter-spacing: 0.5px; }
        .kanban-cards { padding: 12px; display: flex; flex-direction: column; gap: 12px; flex: 1; overflow-y: auto; }
        
        .op-card {
            background: var(--fundo-card); border: 1px solid var(--borda); border-radius: 10px;
            padding: 16px; cursor: pointer; transition: all 0.2s; position: relative;
        }
        .op-card:hover { transform: translateY(-3px); border-color: var(--primaria); box-shadow: var(--sombra-hover); }
        .op-card-title { font-size: 14px; font-weight: 700; color: #fff; margin-bottom: 4px; }
        .op-card-meta { font-size: 11px; color: var(--texto-suave); display: flex; align-items: center; gap: 6px; }
        .op-card-footer { margin-top: 12px; padding-top: 12px; border-top: 1px solid var(--borda); display: flex; justify-content: space-between; align-items: center; }
        
        .temp-hot { color: #ef4444; }
        .temp-warm { color: #f59e0b; }
        .temp-cold { color: #3b82f6; }
    </style>
</head>
<body class="com-page">
  <div class="app-layout">
    <aside class="app-sidebar" id="sidebar"></aside>

    <main class="app-content">
      <header class="app-header"></header>

      <div class="app-body">
        <div class="justify-between flex items-center mb-6">
          <div class="page-title">
            <h1>Pipeline de Vendas</h1>
            <p class="text-suave">Gerencie suas oportunidades e impulsione o fechamento de negócios.</p>
          </div>
          <div class="flex gap-2">
            <select id="f-responsavel" class="form-control" onchange="aplicarFiltros()"><option value="">Todos Vendedores</option></select>
            <button class="btn btn-primario btn-sm" onclick="abrirModalNovaOp()"><i class="ph ph-plus-circle"></i> Criar Venda</button>
          </div>
        </div>

        <div class="kanban-container" id="kanban-board">
            <div class="flex items-center gap-2 p-10 text-suave"><div class="spinner"></div> Carregando funil...</div>
        </div>
      </div>
    </main>
  </div>

  <!-- Modal Detalhes Op -->
  <div id="modal-op" class="modal-overlay d-none">
    <div class="modal" style="max-width: 700px">
        <div class="modal-header">
            <h3 id="modal-op-titulo">Resumo da Negociação</h3>
            <button class="modal-fechar" onclick="fecharModalOp()">✕</button>
        </div>
        <div class="p-6">
            <div class="grid-2 gap-4 mb-6">
                <div class="card p-4" id="op-info-lead"></div>
                <div class="card p-4" id="op-info-op"></div>
            </div>
            <div class="card p-4 mb-6">
                <span class="text-xs uppercase fw-800 text-suave block mb-2"><i class="ph ph-robot"></i> Análise de IA</span>
                <div id="op-resumo-ia" class="text-sm text-suave leading-relaxed"></div>
            </div>
            <div class="flex gap-2 justify-end">
                <button class="btn btn-outline" onclick="fecharModalOp()">Fechar</button>
                <button class="btn btn-primario" onclick="setTabOp('acoes')">Gerenciar Venda</button>
            </div>
        </div>
    </div>
  </div>

  <script src="/assets/js/api.js"></script>
  <script src="/assets/js/auth.js"></script>
  <script src="/assets/js/sidebar-admin.js"></script>
  <script>
    const usuario = protegerPagina(['admin','comercial']);
    let oportunidadesCache = [];
    const COLUNAS = [
      { id: 'novo_interesse', label: 'Interesse', color: '#3b82f6', icon: 'ph-sparkle' },
      { id: 'qualificacao', label: 'Qualificação', color: '#8b5cf6', icon: 'ph-magnifying-glass' },
      { id: 'reuniao_agendada', label: 'Reunião', color: '#f59e0b', icon: 'ph-calendar' },
      { id: 'proposta', label: 'Proposta', color: '#f97316', icon: 'ph-file-text' },
      { id: 'negociacao', label: 'Negociação', color: '#ec4899', icon: 'ph-handshake' },
      { id: 'fechado', label: 'Fechado', color: '#22c55e', icon: 'ph-trophy' }
    ];

    if (usuario) { inicializarLayout(); carregarOportunidades(); }

    async function carregarOportunidades() {
        try {
            const { oportunidades } = await api.get('/oportunidades');
            oportunidadesCache = oportunidades || [];
            renderizarKanban(oportunidadesCache);
        } catch { }
    }

    function renderizarKanban(ops) {
        const board = document.getElementById('kanban-board');
        board.innerHTML = COLUNAS.map(col => {
            const cards = ops.filter(o => o.etapa === col.id);
            return `
            <div class="kanban-col">
                <div class="kanban-col-header" style="border-bottom-color: ${col.color}">
                    <div class="flex items-center gap-2">
                        <i class="ph ${col.icon}" style="color: ${col.color}"></i>
                        <span class="kanban-col-title">${col.label}</span>
                    </div>
                    <span class="badge badge-cinza">${cards.length}</span>
                </div>
                <div class="kanban-cards">
                    ${cards.map(o => renderizarCard(o)).join('')}
                    ${!cards.length ? '<div class="text-center py-6 text-xs text-suave">Sem oportunidades aqui.</div>' : ''}
                </div>
            </div>`;
        }).join('');
    }

    function renderizarCard(o) {
        const tempColor = { quente: 'temp-hot', morno: 'temp-warm', frio: 'temp-cold' };
        return `
        <div class="op-card" onclick="abrirOp(${o.id})">
            <div class="op-card-title">${o.leads?.nome || o.leads?.empresa || 'Oportunidade'}</div>
            <div class="op-card-meta">
                <i class="ph ph-buildings"></i> ${o.leads?.empresa || 'Individual'}
            </div>
            <div class="op-card-footer">
                <div class="flex items-center gap-1 text-xs">
                    <i class="ph ph-fire ${tempColor[o.temperatura]}"></i> 
                    <span class="fw-700 text-white">${o.score || 0}%</span>
                </div>
                <div class="text-xs text-suave">${formatarData(o.atualizado_em)}</div>
            </div>
        </div>`;
    }

    async function abrirOp(id) {
        document.getElementById('modal-op').classList.remove('d-none');
        try {
            const { oportunidade } = await api.get(`/oportunidades/${id}`);
            document.getElementById('modal-op-titulo').textContent = oportunidade.titulo;
            document.getElementById('op-resumo-ia').textContent = oportunidade.resumo_ia || 'IA ainda não analisou esta oportunidade.';
            document.getElementById('op-info-lead').innerHTML = `<div class="text-xs text-suave uppercase block mb-2">Cliente</div><div class="fw-700 text-white">${oportunidade.leads?.nome}</div><div class="text-xs">${oportunidade.leads?.empresa || ''}</div>`;
            document.getElementById('op-info-op').innerHTML = `<div class="text-xs text-suave uppercase block mb-2">Negociação</div><div class="fw-700 text-white">${oportunidade.temperatura}</div><div class="text-xs">${oportunidade.etapa.replace('_',' ')}</div>`;
        } catch { }
    }

    function fecharModalOp() { document.getElementById('modal-op').classList.add('d-none'); }
  </script>
</body>
</html>
