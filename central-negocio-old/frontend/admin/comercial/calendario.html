<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calendário Commercial — Central do Negócio</title>
  <script src="https://unpkg.com/@phosphor-icons/web"></script>
  <link rel="stylesheet" href="/assets/css/global.css">
  <link rel="stylesheet" href="/assets/css/painel.css">
  <link rel="stylesheet" href="/assets/css/comercial.css">
  <style>
    .cal-wrapper { display: grid; grid-template-columns: 1fr 320px; gap: 24px; }
    .cal-header-nav { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; padding: 16px; background: rgba(255,255,255,0.02); border-radius: 12px; border: 1px solid var(--borda); }
    
    .cal-grid-main { display: grid; grid-template-columns: repeat(7, 1fr); border: 1px solid var(--borda); border-radius: var(--radius-lg); overflow: hidden; background: var(--borda); gap: 1px; }
    .cal-day-label { background: rgba(255,255,255,0.03); padding: 12px; text-align: center; font-size: 11px; text-transform: uppercase; color: var(--texto-suave); font-weight: 700; letter-spacing: 1px; }
    .cal-day-cell { background: var(--fundo-card); min-height: 120px; padding: 12px; cursor: pointer; transition: var(--transicao); }
    .cal-day-cell:hover { background: rgba(59, 130, 246, 0.05); }
    .cal-day-cell.today { background: rgba(59, 130, 246, 0.02); }
    .cal-day-cell.today .day-number { background: var(--primaria); color: #fff; width: 28px; height: 28px; border-radius: 50%; display: flex; align-items: center; justify-content: center; transform: translate(-8px, -8px); }
    .day-number { font-size: 14px; font-weight: 600; color: var(--texto-suave); margin-bottom: 8px; display: block; }
    .other-month { opacity: 0.3; }

    .event-pill { font-size: 10px; padding: 4px 8px; border-radius: 4px; margin-bottom: 4px; border-left: 3px solid var(--primaria); background: rgba(59, 130, 246, 0.1); color: #fff; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .event-concluida { border-color: var(--sucesso); background: rgba(16, 185, 129, 0.1); }
    .event-cancelada { border-color: var(--erro); background: rgba(239, 68, 68, 0.1); text-decoration: line-through; opacity: 0.6; }

    .upcoming-item { padding: 12px; border-radius: 8px; background: rgba(255,255,255,0.02); border: 1px solid var(--borda); margin-bottom: 8px; cursor: pointer; transition: 0.2s; }
    .upcoming-item:hover { border-color: var(--primaria); background: rgba(59, 130, 246, 0.05); }
  </style>
</head>
<body class="com-page">
  <div class="app-layout">
    <aside class="app-sidebar" id="sidebar"></aside>

    <main class="app-content">
      <header class="app-header"></header>

      <div class="app-body">
        <div class="justify-between flex items-center mb-6">
          <div class="page-title">
            <h1>Agenda Comercial</h1>
            <p class="text-suave">Gerencie suas reuniões, demonstrações e fechamentos.</p>
          </div>
          <button class="btn btn-primario btn-sm" onclick="abrirModalNova()"><i class="ph ph-calendar-plus"></i> Agendar Reunião</button>
        </div>

        <div class="cal-wrapper">
            <div class="cal-main-column">
                <div class="cal-header-nav">
                    <div class="flex gap-2">
                        <button class="btn btn-icon-sm" onclick="navegarMes(-1)"><i class="ph ph-caret-left"></i></button>
                        <button class="btn btn-outline btn-sm" onclick="irHoje()">Hoje</button>
                        <button class="btn btn-icon-sm" onclick="navegarMes(1)"><i class="ph ph-caret-right"></i></button>
                    </div>
                    <h2 id="mes-titulo" class="m-0 text-white text-lg">Mês atual</h2>
                    <div class="flex gap-2">
                        <span class="badge badge-azul">Mês</span>
                    </div>
                </div>

                <div class="cal-grid-main">
                    <div class="cal-day-label">Dom</div>
                    <div class="cal-day-label">Seg</div>
                    <div class="cal-day-label">Ter</div>
                    <div class="cal-day-label">Qua</div>
                    <div class="cal-day-label">Qui</div>
                    <div class="cal-day-label">Sex</div>
                    <div class="cal-day-label">Sáb</div>
                    <!-- Dias dinâmicos -->
                    <div id="cal-days-container" style="display: contents;"></div>
                </div>
            </div>

            <div class="cal-side-column">
                <div class="card mb-6">
                    <h3 class="card-titulo mb-4"><i class="ph ph-clock"></i> Próximos Compromissos</h3>
                    <div id="proximas-reunioes">
                        <div class="spinner"></div>
                    </div>
                </div>
                <div class="card">
                    <h3 class="card-titulo mb-4"><i class="ph ph-chart-pie"></i> Desempenho</h3>
                    <div id="resumo-mes" class="flex flex-col gap-2">
                        <!-- Stats dinâmicos -->
                    </div>
                </div>
            </div>
        </div>
      </div>
    </main>
  </div>

  <!-- Modal Reunião -->
  <div id="modal-reuniao" class="modal-overlay d-none">
    <div class="modal" style="max-width: 500px">
        <div class="modal-header">
            <h3 id="modal-reuniao-titulo">Agendar Reunião</h3>
            <button class="modal-fechar" onclick="fecharModal()">✕</button>
        </div>
        <form onsubmit="salvarReuniao(event)" class="p-6">
            <div class="form-grupo">
                <label>Título do Compromisso</label>
                <input type="text" id="r-titulo" class="form-control" required placeholder="Ex: Call de Demonstração">
            </div>
            <div class="grid-2">
                <div class="form-grupo"><label>Data</label><input type="date" id="r-data" class="form-control" required></div>
                <div class="form-grupo"><label>Hora</label><input type="time" id="r-hora" class="form-control" required></div>
            </div>
            <div class="form-grupo">
                <label>Lead Responsável</label>
                <div style="position:relative">
                    <input type="text" id="r-lead-busca" class="form-control" placeholder="Buscar lead..." oninput="buscarLeads(this.value)">
                    <div id="r-lead-resultados" style="position:absolute; width:100%; z-index:10"></div>
                </div>
                <input type="hidden" id="r-lead-id">
            </div>
            <div class="form-grupo">
                <label>Observações</label>
                <textarea id="r-observacoes" class="form-control" rows="3"></textarea>
            </div>
            <div id="acoes-existente" class="d-none mb-4 flex gap-2">
                <button type="button" class="btn btn-outline w-100" onclick="concluirReuniao()">Concluir</button>
            </div>
            <button type="submit" class="btn btn-primario w-100" id="btn-salvar-reuniao">Salvar Compromisso</button>
        </form>
    </div>
  </div>

  <script src="/assets/js/api.js"></script>
  <script src="/assets/js/auth.js"></script>
  <script src="/assets/js/sidebar-admin.js"></script>
  <script>
    const usuario = protegerPagina(['admin','comercial']);
    let mesAtual = new Date(), todasReunioes = [], reuniaoEditandoId = null;

    if (usuario) { inicializarLayout(); carregarReunioes(); }

    async function carregarReunioes() {
        const i = new Date(mesAtual.getFullYear(), mesAtual.getMonth(), 1).toISOString();
        const f = new Date(mesAtual.getFullYear(), mesAtual.getMonth()+1, 0).toISOString();
        try {
            const { reunioes } = await api.get(`/reunioes?data_inicio=${i}&data_fim=${f}`);
            todasReunioes = reunioes;
            renderizarCalendario(); renderizarProximas(); renderizarResumo();
        } catch { }
    }

    function renderizarCalendario() {
        const ano = mesAtual.getFullYear(), mes = mesAtual.getMonth();
        document.getElementById('mes-titulo').textContent = mesAtual.toLocaleDateString('pt-BR', { month:'long', year:'numeric' });
        
        const primeiro = new Date(ano, mes, 1), ultimo = new Date(ano, mes+1, 0);
        const dias = [];
        const ini = new Date(primeiro); ini.setDate(1 - primeiro.getDay());
        
        while(dias.length < 42) {
            dias.push(new Date(ini));
            ini.setDate(ini.getDate() + 1);
        }

        const container = document.getElementById('cal-days-container');
        container.innerHTML = dias.map(d => {
            const isHoje = d.toDateString() === new Date().toDateString();
            const isOutro = d.getMonth() !== mes;
            const dStr = d.toISOString().split('T')[0];
            const evts = todasReunioes.filter(r => r.data_hora.startsWith(dStr));
            
            return `
            <div class="cal-day-cell ${isHoje?'today':''} ${isOutro?'other-month':''}" onclick="abrirNova('${dStr}')">
                <span class="day-number">${d.getDate()}</span>
                ${evts.map(e => `<div class="event-pill event-${e.status}" onclick="event.stopPropagation(); abrirEdicao(${e.id})">${e.titulo}</div>`).join('')}
            </div>`;
        }).join('');
    }

    function renderizarProximas() {
        const prox = todasReunioes.filter(r => new Date(r.data_hora) >= new Date() && r.status === 'agendada').slice(0, 5);
        document.getElementById('proximas-reunioes').innerHTML = prox.map(r => `
            <div class="upcoming-item" onclick="abrirEdicao(${r.id})">
                <div class="text-xs fw-700 text-white">${r.titulo}</div>
                <div class="text-xs text-suave">${new Date(r.data_hora).toLocaleString('pt-BR')}</div>
            </div>
        `).join('') || '<div class="text-xs text-suave text-center py-4">Sem compromissos.</div>';
    }

    function renderizarResumo() {
        const c = todasReunioes.filter(r => r.status === 'concluida').length;
        const a = todasReunioes.filter(r => r.status === 'agendada').length;
        document.getElementById('resumo-mes').innerHTML = `
            <div class="flex justify-between items-center text-xs"><span>Agendadas</span><span class="badge badge-azul">${a}</span></div>
            <div class="flex justify-between items-center text-xs"><span>Concluídas</span><span class="badge badge-verde">${c}</span></div>
        `;
    }

    function navegarMes(dir) { mesAtual.setMonth(mesAtual.getMonth() + dir); carregarReunioes(); }
    function irHoje() { mesAtual = new Date(); carregarReunioes(); }

    function abrirNova(data) { reuniaoEditandoId = null; document.getElementById('r-data').value = data; document.getElementById('modal-reuniao').classList.remove('d-none'); }
    async function abrirEdicao(id) {
        reuniaoEditandoId = id;
        document.getElementById('modal-reuniao').classList.remove('d-none');
        const { reunioes } = await api.get(`/reunioes/${id}`); // Assumindo endpoint individual ou similar
        const r = reunioes; // Ajustar conforme retorno real
        document.getElementById('r-titulo').value = r.titulo;
        document.getElementById('r-data').value = r.data_hora.split('T')[0];
        document.getElementById('r-hora').value = r.data_hora.split('T')[1].slice(0,5);
        document.getElementById('r-lead-id').value = r.lead_id;
        document.getElementById('r-lead-busca').value = r.leads?.nome || '';
        document.getElementById('acoes-existente').classList.remove('d-none');
    }

    function fecharModal() { document.getElementById('modal-reuniao').classList.add('d-none'); }

    async function salvarReuniao(e) {
        e.preventDefault();
        const body = { titulo: document.getElementById('r-titulo').value, data_hora: new Date(`${document.getElementById('r-data').value}T${document.getElementById('r-hora').value}`).toISOString(), lead_id: document.getElementById('r-lead-id').value || null };
        if(reuniaoEditandoId) await api.patch(`/reunioes/${reuniaoEditandoId}`, body);
        else await api.post('/reunioes', body);
        fecharModal(); carregarReunioes();
    }
  </script>
</body>
</html>
