<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Leads — Comercial — Central do Negócio</title>
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <link rel="stylesheet" href="/assets/css/global.css">
    <link rel="stylesheet" href="/assets/css/painel.css">
    <link rel="stylesheet" href="/assets/css/comercial.css">
    <style>
        .filters-container {
            background: var(--fundo-card); border: 1px solid var(--borda);
            padding: 24px; border-radius: var(--radius-lg); margin-bottom: 24px;
        }
        .leads-table th { padding: 16px; font-size: 11px; text-transform: uppercase; letter-spacing: 1px; color: var(--texto-suave); border-bottom: 1px solid var(--borda); }
        .leads-table td { padding: 16px; border-bottom: 1px solid var(--borda); vertical-align: middle; }
        .leads-table tr:hover { background: rgba(59, 130, 246, 0.03); }
        
        .score-dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; margin-right: 4px; }
        .score-high { background: var(--sucesso); box-shadow: 0 0 8px var(--sucesso); }
        .score-mid { background: #f59e0b; }
        .score-low { background: var(--erro); }

        .drawer-content { padding: 32px; color: var(--texto); }
        .drawer-section { margin-bottom: 32px; border-bottom: 1px solid var(--borda); padding-bottom: 24px; }
        .drawer-section:last-child { border: none; }
        .drawer-label { font-size: 11px; text-transform: uppercase; color: var(--texto-suave); margin-bottom: 8px; display: block; }
    </style>
</head>
<body class="com-page">
  <div class="app-layout">
    <aside class="app-sidebar" id="sidebar"></aside>

    <main class="app-content">
      <header class="app-header"></header>

      <div class="app-body">
        <div class="justify-between flex items-center mb-6">
          <div class="page-title">
            <h1>Gestão de Leads</h1>
            <p class="text-suave">Acompanhe e qualifique potenciais clientes para seu negócio.</p>
          </div>
          <div class="flex gap-2">
            <a href="/admin/comercial/importar.html" class="btn btn-outline btn-sm">
                <i class="ph ph-file-arrow-up"></i> Importar
            </a>
            <button class="btn btn-primario btn-sm" onclick="abrirModalNovoLead()">
                <i class="ph ph-user-plus"></i> Novo Lead
            </button>
          </div>
        </div>

        <div class="filters-container">
            <div class="grid-4 gap-3">
                <div style="position:relative">
                    <i class="ph ph-magnifying-glass" style="position:absolute; left:12px; top:50%; transform:translateY(-50%); color:var(--texto-suave)"></i>
                    <input type="text" id="busca" placeholder="Nome, Empresa ou WhatsApp..." 
                           class="form-control" style="padding-left:40px" oninput="debounceCarregar()">
                </div>
                <select id="f-status" class="form-control" onchange="carregarLeads()">
                    <option value="">Status: Todos</option>
                    <option value="novo">Novo</option>
                    <option value="qualificado">Qualificado</option>
                    <option value="convertido">Convertido</option>
                    <option value="perdido">Perdido</option>
                </select>
                <select id="f-interesse" class="form-control" onchange="carregarLeads()">
                    <option value="">Interesse: Todos</option>
                    <option value="true">Com Interesse</option>
                    <option value="false">Sem Interesse</option>
                </select>
                <div class="flex gap-2">
                    <button class="btn btn-outline w-100" onclick="limparFiltros()"><i class="ph ph-funnel-x"></i> Limpar</button>
                </div>
            </div>
        </div>

        <div class="card p-0 overflow-hidden">
          <div class="tabela-container">
            <table class="leads-table">
              <thead>
                <tr>
                  <th><input type="checkbox" id="check-all" onclick="toggleAll(this)"></th>
                  <th>Identificação</th>
                  <th>Contato</th>
                  <th>Cidade</th>
                  <th>Segmento</th>
                  <th>Score</th>
                  <th>Status</th>
                  <th>Cadastro</th>
                  <th>Ações</th>
                </tr>
              </thead>
              <tbody id="tbody-leads">
                <tr><td colspan="9" class="text-center py-6"><div class="spinner"></div></td></tr>
              </tbody>
            </table>
          </div>
          <div class="p-4 flex justify-between items-center border-t" style="border-color:var(--borda)">
              <div class="text-xs text-suave" id="paginacao-info">Mostrando 0 de 0 leads</div>
              <div class="flex gap-1">
                  <button class="btn btn-outline btn-sm" id="btn-anterior" onclick="mudarPagina(-1)"><i class="ph ph-caret-left"></i></button>
                  <button class="btn btn-outline btn-sm" id="btn-proximo" onclick="mudarPagina(1)"><i class="ph ph-caret-right"></i></button>
              </div>
          </div>
        </div>
      </div>
    </main>
  </div>

  <!-- Drawer Detalhes -->
  <div id="drawer-lead" class="com-drawer">
      <div class="com-drawer-header">
          <h3 id="drawer-titulo">Perfil do Lead</h3>
          <button class="com-modal-fechar" onclick="fecharDrawer()"><i class="ph ph-x"></i></button>
      </div>
      <div class="drawer-content" id="drawer-body">
          <div class="spinner"></div>
      </div>
  </div>
  <div id="drawer-overlay" style="display:none; position:fixed; inset:0; background:rgba(0,0,0,0.4); z-index:499" onclick="fecharDrawer()"></div>

  <!-- Modal Novo Lead -->
  <div id="modal-novo-lead" class="modal-overlay d-none">
      <div class="modal">
          <div class="modal-header">
              <h3>Novo Potencial Cliente</h3>
              <button class="modal-fechar" onclick="fecharModalNovoLead()">✕</button>
          </div>
          <form onsubmit="salvarNovoLead(event)" class="p-4">
              <div class="grid-2">
                <div class="form-grupo"><label>Nome</label><input type="text" id="nl-nome" class="form-control"></div>
                <div class="form-grupo"><label>Empresa</label><input type="text" id="nl-empresa" class="form-control"></div>
                <div class="form-grupo"><label>WhatsApp *</label><input type="text" id="nl-whatsapp" class="form-control" required></div>
                <div class="form-grupo"><label>Cidade</label><input type="text" id="nl-cidade" class="form-control"></div>
              </div>
              <div class="form-grupo">
                  <label>Segmento</label>
                  <select id="nl-segmento" class="form-control">
                      <option value="">Selecione...</option>
                      <option value="restaurante">Restaurante</option>
                      <option value="varejo">Varejo</option>
                      <option value="servicos">Serviços</option>
                  </select>
              </div>
              <button type="submit" id="btn-salvar-lead" class="btn btn-primario w-100 mt-2">Salvar Lead</button>
          </form>
      </div>
  </div>

  <script src="/assets/js/api.js"></script>
  <script src="/assets/js/auth.js"></script>
  <script src="/assets/js/sidebar-admin.js"></script>
  <script>
    const usuario = protegerPagina(['admin','comercial']);
    let paginaAtual = 0, totalLeads = 0, debounceTimer;

    if (usuario) { inicializarLayout(); carregarLeads(); }

    function debounceCarregar() { clearTimeout(debounceTimer); debounceTimer = setTimeout(carregarLeads, 400); }

    function limparFiltros() {
        ['busca','f-status','f-interesse'].forEach(id => document.getElementById(id).value = '');
        paginaAtual = 0; carregarLeads();
    }

    async function carregarLeads() {
        const params = new URLSearchParams({ limit: 50, offset: paginaAtual * 50 });
        const busca = document.getElementById('busca').value; if(busca) params.set('busca', busca);
        const status = document.getElementById('f-status').value; if(status) params.set('status', status);
        const interesse = document.getElementById('f-interesse').value; if(interesse) params.set('com_interesse', interesse);

        try {
            const { leads, total } = await api.get('/comercial/leads?' + params.toString());
            totalLeads = total; renderizarLeads(leads);
            document.getElementById('paginacao-info').textContent = `Mostrando ${leads.length} de ${total} leads`;
        } catch { }
    }

    function renderizarLeads(leads) {
        const tbody = document.getElementById('tbody-leads');
        if(!leads.length) { tbody.innerHTML = '<tr><td colspan="9" class="text-center py-6 text-suave">Nenhum lead encontrado.</td></tr>'; return; }
        
        tbody.innerHTML = leads.map(l => {
            const statusColor = { novo: 'badge-azul', qualificado: 'badge-amarelo', convertido: 'badge-verde', perdido: 'badge-vermelho' };
            const scoreClass = l.score >= 70 ? 'score-high' : l.score >= 40 ? 'score-mid' : 'score-low';
            return `
            <tr>
                <td><input type="checkbox" class="lead-check" value="${l.id}"></td>
                <td><div class="fw-700 text-white">${l.nome || l.empresa || '—'}</div><div class="text-xs text-suave">${l.empresa || ''}</div></td>
                <td><div class="flex items-center gap-1 text-xs"><i class="ph ph-whatsapp-logo text-verde"></i> ${l.whatsapp}</div></td>
                <td><span class="text-xs">${l.cidade || '—'}</span></td>
                <td><span class="text-xs uppercase text-suave">${l.segmento || '—'}</span></td>
                <td><div class="flex items-center gap-1"><span class="score-dot ${scoreClass}"></span> <span class="text-xs fw-700">${l.score || 0}%</span></div></td>
                <td><span class="badge ${statusColor[l.status]||'badge-cinza'}">${l.status}</span></td>
                <td><span class="text-xs text-suave">${formatarData(l.criado_em)}</span></td>
                <td><button class="btn btn-icon-sm" onclick="abrirLead(${l.id})"><i class="ph ph-eye"></i></button></td>
            </tr>`;
        }).join('');
    }

    async function abrirLead(id) {
        document.getElementById('drawer-titulo').textContent = 'Carregando...';
        document.getElementById('drawer-body').innerHTML = '<div class="spinner"></div>';
        document.getElementById('drawer-lead').classList.add('aberto');
        document.getElementById('drawer-overlay').style.display = 'block';

        try {
            const { lead, conversas, oportunidade } = await api.get(`/comercial/leads/${id}`);
            document.getElementById('drawer-titulo').textContent = lead.nome || lead.empresa;
            document.getElementById('drawer-body').innerHTML = `
                <div class="drawer-section">
                    <span class="drawer-label">Informações Básicas</span>
                    <div class="grid-2 gap-2 text-sm">
                        <div><div class="text-xs text-suave">WhatsApp</div><div>${lead.whatsapp}</div></div>
                        <div><div class="text-xs text-suave">Cidade</div><div>${lead.cidade || '—'}</div></div>
                        <div><div class="text-xs text-suave">Score de Venda</div><div class="fw-700 text-primaria">${lead.score}%</div></div>
                        <div><div class="text-xs text-suave">Origem</div><div>${lead.origem || '—'}</div></div>
                    </div>
                </div>
                <div class="drawer-section">
                    <span class="drawer-label">Histórico de Mensagens</span>
                    <div class="flex flex-col gap-2">
                        ${conversas.slice(-5).map(c => `
                            <div class="p-2 border rounded" style="background:rgba(255,255,255,0.02)">
                                <div class="text-xs fw-700 text-white mb-1">Lead: ${c.mensagem_lead}</div>
                                <div class="text-xs text-suave italic">IA: ${c.resposta_ia}</div>
                            </div>
                        `).join('') || '<div class="text-xs text-suave">Sem histórico.</div>'}
                    </div>
                </div>
                <div class="mt-4">
                    <button class="btn btn-primaria w-100" onclick="window.open('https://wa.me/${lead.whatsapp}', '_blank')">
                        <i class="ph ph-whatsapp-logo"></i> Chamar no WhatsApp
                    </button>
                    ${!oportunidade ? `<button class="btn btn-outline w-100 mt-2" onclick="enviarKanban(${id})">Mover para Kanban</button>` : ''}
                </div>
            `;
        } catch { }
    }

    function fecharDrawer() { 
        document.getElementById('drawer-lead').classList.remove('aberto'); 
        document.getElementById('drawer-overlay').style.display = 'none'; 
    }

    async function enviarKanban(id) {
        await api.post('/oportunidades', { lead_id: id });
        mostrarAlerta('Oportunidade criada no Kanban!');
        fecharDrawer(); carregarLeads();
    }

    function toggleAll(cb) { document.querySelectorAll('.lead-check').forEach(c => c.checked = cb.checked); }
    function mudarPagina(dir) { paginaAtual += dir; carregarLeads(); }

    function abrirModalNovoLead() { document.getElementById('modal-novo-lead').classList.remove('d-none'); }
    function fecharModalNovoLead() { document.getElementById('modal-novo-lead').classList.add('d-none'); }

    async function salvarNovoLead(e) {
        e.preventDefault();
        const body = { nome: document.getElementById('nl-nome').value, empresa: document.getElementById('nl-empresa').value, whatsapp: document.getElementById('nl-whatsapp').value, cidade: document.getElementById('nl-cidade').value, segmento: document.getElementById('nl-segmento').value };
        await api.post('/comercial/leads', body);
        fecharModalNovoLead(); carregarLeads();
    }
  </script>
</body>
</html>
