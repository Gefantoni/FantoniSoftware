<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Conversas — Comercial — Central do Negócio</title>
  <script src="https://unpkg.com/@phosphor-icons/web"></script>
  <link rel="stylesheet" href="/assets/css/global.css">
  <link rel="stylesheet" href="/assets/css/painel.css">
  <link rel="stylesheet" href="/assets/css/comercial.css">
  <style>
    /* ── Tabs de navegação ── */
    .view-tabs {
      display: flex;
      gap: 4px;
      background: var(--fundo-card);
      border: 1px solid var(--borda);
      border-radius: 12px;
      padding: 4px;
      width: fit-content;
    }
    .view-tab {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      padding: 7px 18px;
      border-radius: 9px;
      border: none;
      background: transparent;
      color: var(--texto-suave);
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: var(--transicao);
    }
    .view-tab:hover { color: var(--texto); background: rgba(255,255,255,.05); }
    .view-tab.active { background: var(--primaria); color: #fff; }

    /* ── Layout SDR ── */
    .chat-layout {
      display: grid;
      grid-template-columns: 300px 1fr 260px;
      height: calc(100vh - 172px);
      background: var(--fundo-card);
      border: 1px solid var(--borda);
      border-radius: var(--radius-lg);
      overflow: hidden;
    }
    .chat-sidebar { border-right: 1px solid var(--borda); display: flex; flex-direction: column; }
    .chat-main    { display: flex; flex-direction: column; }
    .chat-context { border-left: 1px solid var(--borda); overflow-y: auto; }

    /* ── Lista de leads ── */
    .chat-item {
      padding: 13px 16px;
      border-bottom: 1px solid var(--borda);
      cursor: pointer;
      transition: var(--transicao);
    }
    .chat-item:hover  { background: rgba(59,130,246,.05); }
    .chat-item.active { background: rgba(59,130,246,.10); border-left: 3px solid var(--primaria); }

    .chat-item-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 3px; }
    .chat-item-nome   { font-size: 13px; font-weight: 700; color: var(--texto); }
    .chat-item-hora   { font-size: 11px; color: var(--texto-suave); }
    .chat-item-preview { font-size: 12px; color: var(--texto-suave); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 220px; }

    /* ── Badges IA ── */
    .badge-ia-ativa   { display: inline-flex; align-items: center; gap: 3px; font-size: 10px; font-weight: 700; padding: 2px 7px; border-radius: 20px; background: rgba(34,197,94,.15); color: #22c55e; white-space: nowrap; }
    .badge-ia-pausada { display: inline-flex; align-items: center; gap: 3px; font-size: 10px; font-weight: 700; padding: 2px 7px; border-radius: 20px; background: rgba(239,68,68,.15); color: #ef4444; white-space: nowrap; }

    /* ── Bubbles ── */
    .msgs-wrap { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 6px; }
    .bubble { max-width: 76%; padding: 10px 14px; border-radius: 12px; font-size: 13px; line-height: 1.5; }
    .bubble-lead { align-self: flex-start; background: rgba(255,255,255,.07); color: var(--texto); border-bottom-left-radius: 3px; }
    .bubble-ia   { align-self: flex-end;   background: var(--primaria); color: #fff; border-bottom-right-radius: 3px; }
    .bubble-meta { font-size: 10px; opacity: .55; margin-top: 3px; }

    /* ── Context panel ── */
    .ctx-section { padding: 18px 16px; }
    .ctx-section + .ctx-section { border-top: 1px solid var(--borda); }
    .ctx-label { font-size: 10px; text-transform: uppercase; letter-spacing: .5px; color: var(--texto-suave); display: block; margin-bottom: 2px; }
    .ctx-value { font-size: 13px; color: var(--texto); font-weight: 600; margin-bottom: 12px; }

    /* ── Botões ações ── */
    .btn-reativar {
      display: inline-flex; align-items: center; gap: 6px;
      padding: 6px 14px; border-radius: 8px; border: 1px solid rgba(34,197,94,.3);
      background: rgba(34,197,94,.1); color: #22c55e;
      font-size: 12px; font-weight: 700; cursor: pointer; transition: background .15s;
    }
    .btn-reativar:hover { background: rgba(34,197,94,.2); }

    .btn-chatwoot {
      display: inline-flex; align-items: center; gap: 6px;
      padding: 6px 14px; border-radius: 8px; border: 1px solid rgba(99,102,241,.3);
      background: rgba(99,102,241,.1); color: #818cf8;
      font-size: 12px; font-weight: 700; cursor: pointer; text-decoration: none;
      transition: background .15s;
    }
    .btn-chatwoot:hover { background: rgba(99,102,241,.2); }

    /* ── Estado vazio ── */
    .estado-vazio { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; color: var(--texto-suave); text-align: center; padding: 40px; }

    /* ── Iframe Chatwoot ── */
    .chatwoot-frame {
      width: 100%; height: calc(100vh - 172px);
      border: 1px solid var(--borda);
      border-radius: var(--radius-lg);
      overflow: hidden;
      background: var(--fundo-card);
    }
    .chatwoot-frame iframe { width: 100%; height: 100%; border: none; }
    .chatwoot-placeholder {
      width: 100%;
      height: calc(100vh - 172px);
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      background: var(--fundo-card);
      border: 1px solid var(--borda);
      border-radius: var(--radius-lg);
      color: var(--texto-suave);
      text-align: center;
      gap: 12px;
    }

    /* ── Dot pulsando ── */
    .polling-dot {
      width: 7px; height: 7px; border-radius: 50%;
      background: #22c55e; display: inline-block; margin-left: 5px;
      animation: pulsar 2s infinite;
    }
    @keyframes pulsar { 0%,100%{opacity:1} 50%{opacity:.3} }
  </style>
</head>
<body class="com-page">
<div class="app-layout">
  <aside class="app-sidebar" id="sidebar"></aside>

  <main class="app-content">
    <header class="app-header"></header>

    <div class="app-body">
      <!-- Header da página -->
      <div class="justify-between flex items-center mb-4">
        <div class="page-title">
          <h1>Conversas <span class="polling-dot" title="Atualizando a cada 30s"></span></h1>
          <p class="text-suave">Monitore e assuma conversas do agente SDR.</p>
        </div>

        <!-- Seletor de view -->
        <div class="view-tabs">
          <button class="view-tab active" id="tab-sdr" onclick="trocarView('sdr')">
            <i class="ph ph-robot"></i> SDR Bot
          </button>
          <button class="view-tab" id="tab-chatwoot" onclick="trocarView('chatwoot')">
            <i class="ph ph-chats-circle"></i> Chatwoot Inbox
          </button>
        </div>
      </div>

      <!-- ═══ VIEW SDR ═══════════════════════════════════════════════════════ -->
      <div id="view-sdr">
        <div class="chat-layout">
          <!-- Coluna 1: Lista -->
          <div class="chat-sidebar">
            <div class="p-3" style="border-bottom:1px solid var(--borda)">
              <div style="position:relative">
                <i class="ph ph-magnifying-glass" style="position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--texto-suave);font-size:14px"></i>
                <input type="text" id="busca-lead" class="form-control" placeholder="Buscar lead..." style="padding-left:34px;font-size:13px" oninput="filtrarLista()">
              </div>
            </div>
            <div class="flex-1 overflow-y-auto" id="lista-leads">
              <div class="spinner m-10"></div>
            </div>
          </div>

          <!-- Coluna 2: Chat -->
          <div class="chat-main">
            <div id="janela-vazia" class="estado-vazio">
              <i class="ph ph-chat-centered-text" style="font-size:52px;opacity:.18"></i>
              <h3 class="mt-3" style="font-size:15px">Selecione uma conversa</h3>
              <p class="text-xs">Visualize as mensagens entre o lead e a IA.</p>
            </div>

            <div id="janela-ativa" style="display:none;flex-direction:column;height:100%">
              <!-- Header -->
              <div class="p-4 flex justify-between items-center" style="border-bottom:1px solid var(--borda);background:rgba(255,255,255,.02)">
                <div>
                  <div class="flex items-center gap-2">
                    <h3 id="conv-nome" class="m-0" style="font-size:15px;color:var(--texto)">—</h3>
                    <span id="conv-ia-badge"></span>
                  </div>
                  <div id="conv-sub" class="text-xs text-suave mt-1">—</div>
                </div>
                <div class="flex gap-2">
                  <button id="btn-reativar-ia" class="btn-reativar" onclick="reativarIA()" style="display:none">
                    <i class="ph ph-robot"></i> Reativar IA
                  </button>
                  <a id="btn-abrir-chatwoot" href="#" target="_blank" class="btn-chatwoot" style="display:none">
                    <i class="ph ph-arrow-square-out"></i> Chatwoot
                  </a>
                </div>
              </div>

              <!-- Mensagens -->
              <div class="msgs-wrap" id="mensagens-container"></div>

              <!-- Barra de ações -->
              <div class="p-3 flex gap-2" style="border-top:1px solid var(--borda)">
                <button class="btn btn-outline btn-sm" style="flex:1" onclick="assumirConversa()">
                  <i class="ph ph-user-check"></i> Assumir & pausar IA
                </button>
                <button class="btn btn-primario btn-sm" style="flex:1" onclick="moverKanban()">
                  <i class="ph ph-funnel"></i> Mover p/ Kanban
                </button>
              </div>
            </div>
          </div>

          <!-- Coluna 3: Contexto do lead -->
          <div class="chat-context">
            <div id="contexto-vazio" class="text-center p-8 text-suave">
              <i class="ph ph-user-circle" style="font-size:38px;opacity:.18"></i>
              <p class="text-xs mt-3">Selecione um lead.</p>
            </div>
            <div id="contexto-dados" style="display:none">
              <div class="ctx-section">
                <h4 class="text-xs uppercase fw-800 text-primaria mb-3">Perfil</h4>
                <div id="ctx-campos"></div>
              </div>
              <div class="ctx-section">
                <button class="btn btn-outline btn-sm w-100 mb-2" onclick="agendarReuniao()">
                  <i class="ph ph-calendar"></i> Agendar Reunião
                </button>
                <a id="ctx-wa-link" href="#" target="_blank" class="btn btn-sm w-100"
                   style="background:rgba(34,197,94,.12);color:#22c55e;border:1px solid rgba(34,197,94,.25);display:none;justify-content:center;align-items:center;gap:6px;font-weight:700;font-size:12px;border-radius:8px;padding:7px 0;text-decoration:none">
                  <i class="ph ph-whatsapp-logo"></i> WhatsApp
                </a>
              </div>
            </div>
          </div>
        </div>
      </div>

      <!-- ═══ VIEW CHATWOOT ══════════════════════════════════════════════════ -->
      <div id="view-chatwoot" style="display:none">
        <div id="chatwoot-container"></div>
      </div>
    </div>
  </main>
</div>

<script src="/assets/js/api.js"></script>
<script src="/assets/js/auth.js"></script>
<script src="/assets/js/sidebar-admin.js"></script>
<script>
  const usuario = protegerPagina(['admin', 'comercial']);
  let leadsCache = [], leadAtualId = null, leadAtualDados = null;
  let pollingTimer = null;
  let cwConfig = { url: null, accountId: '1' };

  if (usuario) {
    inicializarLayout();
    carregarLeads();
    iniciarPolling();
    carregarChatwootConfig();
  }

  // ── Config Chatwoot ────────────────────────────────────────────────────────
  async function carregarChatwootConfig() {
    try {
      cwConfig = await api.get('/comercial/chatwoot-config');
    } catch {}
  }

  // ── Troca de view ──────────────────────────────────────────────────────────
  function trocarView(view) {
    document.getElementById('view-sdr').style.display      = view === 'sdr'      ? '' : 'none';
    document.getElementById('view-chatwoot').style.display = view === 'chatwoot' ? '' : 'none';
    document.getElementById('tab-sdr').classList.toggle('active',      view === 'sdr');
    document.getElementById('tab-chatwoot').classList.toggle('active', view === 'chatwoot');

    if (view === 'chatwoot') renderChatwootFrame();
  }

  function renderChatwootFrame() {
    const container = document.getElementById('chatwoot-container');
    if (container.dataset.loaded) return; // já montado

    if (!cwConfig.url) {
      container.innerHTML = `
        <div class="chatwoot-placeholder">
          <i class="ph ph-plug-charging" style="font-size:52px;opacity:.2"></i>
          <h3 style="font-size:15px">Chatwoot não configurado</h3>
          <p class="text-xs" style="max-width:320px">
            Defina <code>CHATWOOT_URL</code>, <code>CHATWOOT_API_TOKEN</code> e
            <code>CHATWOOT_INBOX_ID</code> no <code>.env</code> do backend para ativar
            a sincronização e visualização aqui.
          </p>
        </div>`;
      return;
    }

    const iframeUrl = `${cwConfig.url}/app/accounts/${cwConfig.accountId}`;
    container.innerHTML = `
      <div class="chatwoot-frame">
        <iframe src="${iframeUrl}" allow="microphone; camera" title="Chatwoot Inbox"></iframe>
      </div>`;
    container.dataset.loaded = '1';
  }

  // ── Polling ────────────────────────────────────────────────────────────────
  function iniciarPolling() {
    pollingTimer = setInterval(async () => {
      await carregarLeads(true);
      if (leadAtualId) await carregarConversa(leadAtualId, true);
    }, 30000);
  }

  // ── Lista de leads ─────────────────────────────────────────────────────────
  async function carregarLeads(silent = false) {
    try {
      const { leads } = await api.get('/comercial/leads');
      leadsCache = (leads || []).filter(l => l.origem === 'whatsapp' || l.instancia);
      leadsCache.sort((a, b) => new Date(b.ultima_interacao || b.atualizado_em) - new Date(a.ultima_interacao || a.atualizado_em));
      renderizarLista(leadsCache);
    } catch (e) {
      if (!silent) console.error('Erro ao carregar leads:', e.message);
    }
  }

  function renderizarLista(leads) {
    const container = document.getElementById('lista-leads');
    if (!leads.length) {
      container.innerHTML = '<div class="text-center text-suave p-8 text-xs">Nenhuma conversa ainda.</div>';
      return;
    }
    container.innerHTML = leads.map(l => {
      const iaAtiva = l.ia_ativa !== false;
      const badge = iaAtiva
        ? '<span class="badge-ia-ativa"><i class="ph ph-robot"></i> IA</span>'
        : '<span class="badge-ia-pausada"><i class="ph ph-user-check"></i> Humano</span>';
      const nome  = esc(l.nome || l.empresa || l.whatsapp);
      const hora  = formatarDataCurta(l.ultima_interacao || l.atualizado_em);
      const preview = esc(l.ultima_mensagem || '...');

      return `<div class="chat-item ${leadAtualId === l.id ? 'active' : ''}" onclick="abrirConversa(${l.id})">
        <div class="chat-item-header">
          <span class="chat-item-nome">${nome}</span>
          <span class="chat-item-hora">${hora}</span>
        </div>
        <div class="flex justify-between items-center mt-1">
          <span class="chat-item-preview">${preview}</span>
          ${badge}
        </div>
      </div>`;
    }).join('');
  }

  // ── Abre conversa ──────────────────────────────────────────────────────────
  async function abrirConversa(id) {
    leadAtualId = id;
    renderizarLista(leadsCache);

    document.getElementById('janela-vazia').style.display  = 'none';
    document.getElementById('janela-ativa').style.display  = 'flex';
    document.getElementById('contexto-vazio').style.display = 'none';
    document.getElementById('contexto-dados').style.display = 'block';
    document.getElementById('mensagens-container').innerHTML = '<div class="spinner m-10"></div>';

    await carregarConversa(id);
  }

  async function carregarConversa(id, silent = false) {
    try {
      const { lead, conversas } = await api.get(`/comercial/leads/${id}`);
      leadAtualDados = lead;

      // Header
      document.getElementById('conv-nome').textContent = lead.nome || lead.whatsapp;
      document.getElementById('conv-sub').textContent  = lead.empresa || lead.cidade || lead.whatsapp || '';

      // Badge IA
      const iaAtiva = lead.ia_ativa !== false;
      document.getElementById('conv-ia-badge').innerHTML = iaAtiva
        ? '<span class="badge-ia-ativa"><i class="ph ph-robot"></i> IA ativa</span>'
        : '<span class="badge-ia-pausada"><i class="ph ph-user-check"></i> Humano assumiu</span>';

      // Botão reativar
      document.getElementById('btn-reativar-ia').style.display = iaAtiva ? 'none' : 'inline-flex';

      // Botão Chatwoot (direto para a conversa se tiver ID)
      const btnCw = document.getElementById('btn-abrir-chatwoot');
      if (cwConfig.url && lead.chatwoot_conversation_id) {
        btnCw.href = `${cwConfig.url}/app/accounts/${cwConfig.accountId}/conversations/${lead.chatwoot_conversation_id}`;
        btnCw.style.display = 'inline-flex';
      } else if (cwConfig.url) {
        btnCw.href = `${cwConfig.url}/app/accounts/${cwConfig.accountId}`;
        btnCw.style.display = 'inline-flex';
      } else {
        btnCw.style.display = 'none';
      }

      // Mensagens
      const mc = document.getElementById('mensagens-container');
      if (!conversas?.length) {
        mc.innerHTML = '<div class="text-center text-suave text-xs p-10">Sem histórico ainda.</div>';
      } else {
        mc.innerHTML = conversas.map(c => `
          <div class="bubble bubble-lead">
            ${esc(c.mensagem_lead)}
            <div class="bubble-meta">${formatarDataCurta(c.criado_em)}</div>
          </div>
          ${c.resposta_ia ? `<div class="bubble bubble-ia">
            ${esc(c.resposta_ia)}
            <div class="bubble-meta">${formatarDataCurta(c.criado_em)}</div>
          </div>` : ''}
        `).join('');
        if (!silent) mc.scrollTop = mc.scrollHeight;
      }

      // Perfil
      const waDigits = (lead.whatsapp || '').replace(/\D/g, '');
      document.getElementById('ctx-campos').innerHTML = `
        <span class="ctx-label">WhatsApp</span>
        <div class="ctx-value">${esc(lead.whatsapp || '—')}</div>
        <span class="ctx-label">Empresa</span>
        <div class="ctx-value">${esc(lead.empresa || '—')}</div>
        <span class="ctx-label">Cidade</span>
        <div class="ctx-value">${esc(lead.cidade || '—')}</div>
        <span class="ctx-label">Score</span>
        <div class="ctx-value" style="color:var(--primaria)">${lead.score || 0}%</div>
        <span class="ctx-label">Status</span>
        <div class="ctx-value"><span class="badge badge-azul">${esc(lead.status || '—')}</span></div>
        <span class="ctx-label">IA</span>
        <div class="ctx-value">${iaAtiva ? '🟢 Ativa' : '🔴 Pausada'}</div>
        ${lead.chatwoot_conversation_id && cwConfig.url ? `
          <span class="ctx-label">Chatwoot</span>
          <div class="ctx-value">
            <a href="${cwConfig.url}/app/accounts/${cwConfig.accountId}/conversations/${lead.chatwoot_conversation_id}"
               target="_blank" class="btn-chatwoot" style="display:inline-flex;font-size:11px;padding:4px 10px">
              <i class="ph ph-arrow-square-out"></i> Conversa #${lead.chatwoot_conversation_id}
            </a>
          </div>` : ''}
      `;

      // Link WhatsApp
      const ctxWa = document.getElementById('ctx-wa-link');
      if (waDigits) {
        ctxWa.href = `https://wa.me/55${waDigits}`;
        ctxWa.style.display = 'flex';
      } else {
        ctxWa.style.display = 'none';
      }
    } catch (e) {
      if (!silent) console.error('Erro ao carregar conversa:', e.message);
    }
  }

  // ── Reativar IA ────────────────────────────────────────────────────────────
  async function reativarIA() {
    if (!leadAtualId) return;
    try {
      await api.post(`/whatsapp/leads/${leadAtualId}/reativar-ia`, {});
      toast('IA reativada — agente voltará a responder automaticamente.');
      await carregarConversa(leadAtualId);
      await carregarLeads(true);
    } catch (e) { toast('Erro: ' + e.message, true); }
  }

  // ── Assumir conversa ───────────────────────────────────────────────────────
  async function assumirConversa() {
    if (!leadAtualId) return;
    try {
      await api.patch(`/comercial/leads/${leadAtualId}`, { ia_ativa: false, status: 'qualificado' });
      toast('IA pausada — você assumiu este atendimento.');
      if (cwConfig.url && leadAtualDados?.chatwoot_conversation_id) {
        window.open(
          `${cwConfig.url}/app/accounts/${cwConfig.accountId}/conversations/${leadAtualDados.chatwoot_conversation_id}`,
          '_blank'
        );
      }
      await carregarConversa(leadAtualId);
      await carregarLeads(true);
    } catch (e) { toast('Erro: ' + e.message, true); }
  }

  // ── Mover para Kanban ──────────────────────────────────────────────────────
  async function moverKanban() {
    if (!leadAtualId) return;
    try {
      await api.post('/oportunidades', { lead_id: leadAtualId });
      toast('Oportunidade criada no Kanban.');
    } catch (e) { toast('Erro: ' + e.message, true); }
  }

  // ── Agendar reunião ────────────────────────────────────────────────────────
  function agendarReuniao() {
    window.location.href = `/admin/comercial/calendario.html?lead_id=${leadAtualId}`;
  }

  // ── Filtrar lista ──────────────────────────────────────────────────────────
  function filtrarLista() {
    const busca = document.getElementById('busca-lead').value.toLowerCase();
    renderizarLista(leadsCache.filter(l =>
      (l.nome || '').toLowerCase().includes(busca) ||
      (l.empresa || '').toLowerCase().includes(busca) ||
      (l.whatsapp || '').includes(busca)
    ));
  }

  // ── Utilitários ────────────────────────────────────────────────────────────
  function formatarDataCurta(iso) {
    if (!iso) return '';
    const d = new Date(iso);
    const hoje = new Date();
    if (d.toDateString() === hoje.toDateString())
      return d.toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' });
    return d.toLocaleDateString('pt-BR', { day: '2-digit', month: '2-digit' });
  }

  function esc(s) {
    return String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  function toast(msg, erro = false) {
    const el = document.createElement('div');
    el.style.cssText = `position:fixed;bottom:24px;right:24px;background:${erro ? '#dc2626' : '#1d4ed8'};color:#fff;padding:12px 20px;border-radius:10px;font-size:13px;font-weight:600;z-index:9999;box-shadow:0 4px 20px rgba(0,0,0,.4);max-width:360px`;
    el.textContent = msg;
    document.body.appendChild(el);
    setTimeout(() => el.remove(), 3500);
  }
</script>
</body>
