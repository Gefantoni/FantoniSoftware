<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Conversas — Comercial — Central do Negócio</title>
  <script src="https://unpkg.com/@phosphor-icons/web"></script>
  <link rel="stylesheet" href="/assets/css/global.css">
  <link rel="stylesheet" href="/assets/css/painel.css">
  <link rel="stylesheet" href="/assets/css/comercial.css">
  <style>
    .chat-layout {
      display: grid; grid-template-columns: 320px 1fr 300px; height: calc(100vh - 120px);
      background: var(--fundo-card); border: 1px solid var(--borda); border-radius: var(--radius-lg); overflow: hidden;
    }
    .chat-sidebar { border-right: 1px solid var(--borda); display: flex; flex-direction: column; background: rgba(255,255,255,0.01); }
    .chat-main { display: flex; flex-direction: column; background: radial-gradient(circle at top right, rgba(59, 130, 246, 0.03), transparent); }
    .chat-context { border-left: 1px solid var(--borda); padding: 24px; overflow-y: auto; background: rgba(255,255,255,0.01); }
    
    .chat-item { padding: 16px; border-bottom: 1px solid var(--borda); cursor: pointer; transition: var(--transicao); }
    .chat-item:hover { background: rgba(59, 130, 246, 0.05); }
    .chat-item.active { background: rgba(59, 130, 246, 0.1); border-left: 4px solid var(--primaria); }
    
    .bubble { max-width: 80%; padding: 12px 16px; border-radius: 12px; font-size: 14px; position: relative; margin-bottom: 8px; }
    .bubble-lead { align-self: flex-start; background: var(--borda); color: var(--texto); border-bottom-left-radius: 2px; }
    .bubble-ia { align-self: flex-end; background: var(--primaria); color: #fff; border-bottom-right-radius: 2px; }
    
    .ctx-label { font-size: 11px; text-transform: uppercase; color: var(--texto-suave); display: block; margin-bottom: 4px; }
    .ctx-value { font-size: 14px; color: #fff; font-weight: 600; margin-bottom: 12px; }
  </style>
</head>
<body class="com-page">
  <div class="app-layout">
    <aside class="app-sidebar" id="sidebar"></aside>

    <main class="app-content">
      <header class="app-header"></header>

      <div class="app-body">
        <div class="justify-between flex items-center mb-6">
          <div class="page-title">
            <h1>Conversas SDR</h1>
            <p class="text-suave">Acompanhe as interações automáticas do seu agente via WhatsApp.</p>
          </div>
          <div class="flex gap-2">
             <span class="badge badge-azul"><i class="ph ph-info"></i> Histórico de IA</span>
          </div>
        </div>

        <div class="chat-layout">
          <!-- Coluna 1: Lista -->
          <div class="chat-sidebar">
            <div class="p-4 border-b" style="border-color:var(--borda)">
               <div style="position:relative">
                  <i class="ph ph-magnifying-glass" style="position:absolute; left:12px; top:50%; transform:translateY(-50%); color:var(--texto-suave)"></i>
                  <input type="text" id="busca-lead" class="form-control" placeholder="Buscar lead..." style="padding-left:40px" oninput="filtrarLista()">
               </div>
            </div>
            <div class="flex-1 overflow-y-auto" id="lista-leads">
               <div class="spinner m-10"></div>
            </div>
          </div>

          <!-- Coluna 2: Chat -->
          <div class="chat-main">
            <div id="janela-vazia" class="flex-1 flex flex-col items-center justify-center text-suave text-center p-10">
                <i class="ph ph-chat-centered-text" style="font-size:64px; opacity:0.2"></i>
                <h3 class="mt-4">Selecione uma conversa</h3>
                <p class="text-xs">Visualize o fluxo de mensagens entre o lead e sua IA.</p>
            </div>

            <div id="janela-ativa" class="d-none flex flex-col h-100">
                <div class="p-4 border-b flex justify-between items-center" style="border-color:var(--borda); background:rgba(255,255,255,0.02)">
                    <div>
                        <h3 id="conv-nome" class="m-0 text-white">Lead</h3>
                        <div id="conv-empresa" class="text-xs text-suave">Empresa</div>
                    </div>
                    <div id="conv-status-badge"></div>
                </div>
                <div class="flex-1 overflow-y-auto p-6 flex flex-col" id="mensagens-container"></div>
                <div class="p-4 border-t flex gap-2" style="border-color:var(--borda)">
                    <button class="btn btn-outline btn-sm w-100" onclick="assumirConversa()"><i class="ph ph-user-check"></i> Assumir</button>
                    <button class="btn btn-primario btn-sm w-100" onclick="enviarKanban()"><i class="ph ph-funnel"></i> Mover p/ Kanban</button>
                </div>
            </div>
          </div>

          <!-- Coluna 3: Contexto -->
          <div class="chat-context">
            <div id="contexto-vazio" class="text-center text-suave mt-10">
                <p class="text-xs">Dados do perfil aparecerão aqui.</p>
            </div>
            <div id="contexto-dados" class="d-none">
                <h4 class="text-xs uppercase fw-800 text-primaria mb-4">Perfil do Cliente</h4>
                <div id="ctx-campos"></div>
                <hr class="my-6" style="border-color:var(--borda); opacity:0.1">
                <button class="btn btn-outline btn-sm w-100 mb-2" onclick="agendarReuniao()"><i class="ph ph-calendar"></i> Agendar Reunião</button>
            </div>
          </div>
        </div>
      </div>
    </main>
  </div>

  <script src="/assets/js/api.js"></script>
  <script src="/assets/js/auth.js"></script>
  <script src="/assets/js/sidebar-admin.js"></script>
  <script>
    const usuario = protegerPagina(['admin','comercial']);
    let leadsCache = [], leadAtualId = null;

    if (usuario) { inicializarLayout(); carregarLeads(); }

    async function carregarLeads() {
        try {
            const { leads } = await api.get('/comercial/leads');
            leadsCache = leads || [];
            renderizarLista(leadsCache);
        } catch { }
    }

    function renderizarLista(leads) {
        const container = document.getElementById('lista-leads');
        container.innerHTML = leads.map(l => `
            <div class="chat-item ${leadAtualId === l.id ? 'active' : ''}" onclick="abrirConversa(${l.id})">
                <div class="flex justify-between items-center mb-1">
                    <span class="fw-700 text-white text-sm">${l.nome || l.empresa || l.whatsapp}</span>
                    <span class="text-xs text-suave">${formatarDataCurta(l.ultima_interacao || l.atualizado_em)}</span>
                </div>
                <div class="text-xs text-suave text-truncate">${l.ultima_mensagem || 'Sem histórico...'}</div>
            </div>
        `).join('');
    }

    async function abrirConversa(id) {
        leadAtualId = id;
        document.querySelectorAll('.chat-item').forEach(el => el.classList.remove('active'));
        document.getElementById('janela-vazia').classList.add('d-none');
        document.getElementById('janela-ativa').classList.remove('d-none');
        document.getElementById('contexto-vazio').classList.add('d-none');
        document.getElementById('contexto-dados').classList.remove('d-none');
        
        try {
            const { lead, conversas } = await api.get(`/comercial/leads/${id}`);
            document.getElementById('conv-nome').textContent = lead.nome || lead.whatsapp;
            document.getElementById('conv-empresa').textContent = lead.empresa || 'Individual';
            
            const mc = document.getElementById('mensagens-container');
            mc.innerHTML = conversas.map(c => `
                <div class="bubble bubble-lead">${c.mensagem_lead}</div>
                ${c.resposta_ia ? `<div class="bubble bubble-ia">${c.resposta_ia}</div>` : ''}
            `).join('');
            mc.scrollTop = mc.scrollHeight;

            document.getElementById('ctx-campos').innerHTML = `
                <span class="ctx-label">WhatsApp</span><div class="ctx-value">${lead.whatsapp}</div>
                <span class="ctx-label">Cidade</span><div class="ctx-value">${lead.cidade || '—'}</div>
                <span class="ctx-label">Score</span><div class="ctx-value text-primaria">${lead.score}%</div>
                <span class="ctx-label">Status</span><div class="ctx-value"><span class="badge badge-azul">${lead.status}</span></div>
            `;
        } catch { }
    }

    function filtrarLista() {
        const busca = document.getElementById('busca-lead').value.toLowerCase();
        const filtrados = leadsCache.filter(l => (l.nome||'').toLowerCase().includes(busca) || (l.whatsapp||'').includes(busca));
        renderizarLista(filtrados);
    }

    function formatarDataCurta(iso) {
        if(!iso) return '';
        const d = new Date(iso);
        return d.toLocaleDateString('pt-BR', { day:'2-digit', month:'2-digit' });
    }

    async function assumirConversa() { await api.patch(`/comercial/leads/${leadAtualId}`, { status: 'qualificado' }); mostrarAlerta('Você assumiu este atendimento.'); }
    async function enviarKanban() { await api.post('/oportunidades', { lead_id: leadAtualId }); mostrarAlerta('Oportunidade criada no Kanban.'); }
    function agendarReuniao() { window.location.href = `/admin/comercial/calendario.html?lead_id=${leadAtualId}`; }
  </script>
</body>
</html>
