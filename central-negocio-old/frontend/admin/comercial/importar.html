<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Importar Leads — Central do Negócio</title>
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <link rel="stylesheet" href="/assets/css/global.css">
    <link rel="stylesheet" href="/assets/css/painel.css">
    <link rel="stylesheet" href="/assets/css/comercial.css">
    <style>
        .import-stepper { display: flex; gap: 4px; margin-bottom: 32px; background: rgba(255,255,255,0.02); padding: 8px; border-radius: 12px; border: 1px solid var(--borda); }
        .step { flex: 1; padding: 12px; text-align: center; font-size: 11px; text-transform: uppercase; font-weight: 700; color: var(--texto-suave); border-radius: 8px; transition: 0.3s; }
        .step.active { background: var(--primaria); color: #fff; }
        .step.done { color: var(--sucesso); }

        .upload-area { 
            border: 2px dashed var(--borda); border-radius: 20px; padding: 60px 40px; text-align: center; 
            cursor: pointer; transition: 0.3s; background: rgba(255,255,255,0.01);
        }
        .upload-area:hover { border-color: var(--primaria); background: rgba(59, 130, 246, 0.05); }
        .upload-area i { font-size: 48px; color: var(--primaria); opacity: 0.5; margin-bottom: 16px; }

        .mapping-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 16px; }
        .mapping-card { background: var(--fundo-card); border: 1px solid var(--borda); padding: 16px; border-radius: 12px; }
    </style>
</head>
<body class="com-page">
  <div class="app-layout">
    <aside class="app-sidebar" id="sidebar"></aside>

    <main class="app-content">
      <header class="app-header"></header>

      <div class="app-body">
        <div class="page-title mb-6">
            <h1>Importação Estratégica</h1>
            <p class="text-suave">Alimente seu funil com listas de leads via CSV ou Excel.</p>
        </div>

        <div class="import-stepper">
            <div class="step active" id="s1">1. Arquivo</div>
            <div class="step" id="s2">2. Mapeamento</div>
            <div class="step" id="s3">3. Revisão</div>
            <div class="step" id="s4">4. Conclusão</div>
        </div>

        <!-- Etapa 1 -->
        <div id="step-1" class="card p-10">
            <div class="upload-area" onclick="document.getElementById('file-input').click()">
                <i class="ph ph-cloud-arrow-up"></i>
                <h3 class="text-white">Selecione seu arquivo</h3>
                <p class="text-suave text-sm">Arraste aqui ou clique para procurar (CSV, XLSX)</p>
            </div>
            <input type="file" id="file-input" hidden onchange="processarArquivo(event)">
            <div id="file-info" class="mt-4"></div>
            <div class="flex justify-end mt-6">
                <button class="btn btn-primario" id="btn-next-1" disabled onclick="irStep(2)">Próximo Passo <i class="ph ph-arrow-right"></i></button>
            </div>
        </div>

        <!-- Etapa 2 -->
        <div id="step-2" class="d-none">
            <div class="card p-6">
                <h3 class="card-titulo mb-6">Mapear Colunas</h3>
                <div class="mapping-grid" id="mapping-container"></div>
                <div class="flex justify-between mt-10">
                    <button class="btn btn-outline" onclick="irStep(1)">Voltar</button>
                    <button class="btn btn-primario" onclick="irStep(3)">Validar Dados</button>
                </div>
            </div>
        </div>
      </div>
    </main>
  </div>

  <script src="/assets/js/api.js"></script>
  <script src="/assets/js/auth.js"></script>
  <script src="/assets/js/sidebar-admin.js"></script>
  <script>
    const usuario = protegerPagina(['admin','comercial']);
    if (usuario) inicializarLayout();

    function irStep(n) {
        document.querySelectorAll('.step').forEach((s, i) => {
            s.classList.toggle('active', i+1 === n);
            s.classList.toggle('done', i+1 < n);
        });
        document.querySelectorAll('[id^="step-"]').forEach(s => s.classList.add('d-none'));
        document.getElementById(`step-${n}`).classList.remove('d-none');
    }

    function processarArquivo(e) {
        const file = e.target.files[0];
        if(file) {
            document.getElementById('file-info').innerHTML = `<div class="badge badge-azul p-3 w-100 flex items-center gap-2"><i class="ph ph-file-csv"></i> ${file.name}</div>`;
            document.getElementById('btn-next-1').disabled = false;
        }
    }
  </script>
</body>
</html>
