<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Relatórios Comerciais — Central do Negócio</title>
  <script src="https://unpkg.com/@phosphor-icons/web"></script>
  <link rel="stylesheet" href="/assets/css/global.css">
  <link rel="stylesheet" href="/assets/css/painel.css">
  <link rel="stylesheet" href="/assets/css/comercial.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    .reports-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 24px; margin-bottom: 32px; }
    .report-card { background: var(--fundo-card); border: 1px solid var(--borda); border-radius: var(--radius-lg); padding: 24px; }
    
    .kpi-mini-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 16px; margin-bottom: 24px; }
    .kpi-mini { background: rgba(255,255,255,0.02); padding: 16px; border-radius: 12px; border: 1px solid var(--borda); }
    .kpi-mini i { color: var(--primaria); font-size: 20px; margin-bottom: 8px; display: block; }
    .kpi-mini .val { font-size: 20px; font-weight: 800; color: #fff; }
    .kpi-mini .lab { font-size: 10px; text-transform: uppercase; color: var(--texto-suave); margin-top: 4px; }

    canvas { max-height: 250px; }
  </style>
</head>
<body class="com-page">
  <div class="app-layout">
    <aside class="app-sidebar" id="sidebar"></aside>

    <main class="app-content">
      <header class="app-header"></header>

      <div class="app-body">
        <div class="justify-between flex items-center mb-6">
          <div class="page-title">
            <h1>Inteligência Comercial</h1>
            <p class="text-suave">Analise o desempenho de suas campanhas, leads e conversão.</p>
          </div>
          <div class="flex gap-2">
            <input type="date" id="f-inicio" class="form-control" style="width:150px">
            <input type="date" id="f-fim" class="form-control" style="width:150px">
            <button class="btn btn-outline btn-sm" onclick="carregarTudo()"><i class="ph ph-arrows-clockwise"></i></button>
          </div>
        </div>

        <div class="tabs mb-6">
            <button class="tab-btn active" onclick="setTab('leads', this)"><i class="ph ph-users-three"></i> Leads</button>
            <button class="tab-btn" onclick="setTab('vendedor', this)"><i class="ph ph-trend-up"></i> Vendas</button>
            <button class="tab-btn" onclick="setTab('ia', this)"><i class="ph ph-robot"></i> Performance IA</button>
        </div>

        <!-- Tab Leads -->
        <div id="tab-leads" class="tab-content active">
            <div class="kpi-mini-grid" id="kpi-leads">
                <div class="spinner"></div>
            </div>
            <div class="grid-2 gap-6">
                <div class="report-card">
                    <h3 class="card-titulo mb-4">Fluxo do Funil</h3>
                    <canvas id="chart-funil"></canvas>
                </div>
                <div class="report-card">
                    <h3 class="card-titulo mb-4">Distribuição de Status</h3>
                    <canvas id="chart-status"></canvas>
                </div>
            </div>
        </div>

        <!-- Tab Vendedor -->
        <div id="tab-vendedor" class="tab-content d-none">
            <div class="kpi-mini-grid" id="kpi-vendedor"></div>
            <div class="report-card">
                <h3 class="card-titulo mb-4">Evolução de Fechamentos</h3>
                <canvas id="chart-vendas"></canvas>
            </div>
        </div>
      </div>
    </main>
  </div>

  <script src="/assets/js/api.js"></script>
  <script src="/assets/js/auth.js"></script>
  <script src="/assets/js/sidebar-admin.js"></script>
  <script>
    const usuario = protegerPagina(['admin','comercial']);
    let charts = {};

    if (usuario) {
        inicializarLayout();
        const hoje = new Date();
        document.getElementById('f-inicio').value = new Date(hoje.getFullYear(), hoje.getMonth(), 1).toISOString().split('T')[0];
        document.getElementById('f-fim').value = hoje.toISOString().split('T')[0];
        carregarTudo();
    }

    function setTab(tab, btn) {
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        document.querySelectorAll('.tab-content').forEach(c => c.classList.add('d-none'));
        btn.classList.add('active');
        document.getElementById('tab-' + tab).classList.remove('d-none');
    }

    async function carregarTudo() {
        try {
            const data = await api.get('/relatorios-comercial/leads');
            renderLeads(data);
            const vend = await api.get('/relatorios-comercial/vendedor');
            renderVendedor(vend);
        } catch { }
    }

    function renderLeads(d) {
        document.getElementById('kpi-leads').innerHTML = `
            <div class="kpi-mini"><i class="ph ph-users"></i><div class="val">${d.total}</div><div class="lab">Total Leads</div></div>
            <div class="kpi-mini"><i class="ph ph-funnel"></i><div class="val">${d.no_kanban}</div><div class="lab">No Funil</div></div>
            <div class="kpi-mini"><i class="ph ph-check-circle"></i><div class="val">${d.convertidos}</div><div class="lab">Convertidos</div></div>
            <div class="kpi-mini"><i class="ph ph-percent"></i><div class="val">${d.taxa_resposta}%</div><div class="lab">Resposta</div></div>
        `;
        
        initChart('chart-status', 'doughnut', {
            labels: ['Novo', 'Qualificado', 'Convertido', 'Perdido'],
            datasets: [{ data: [d.total - d.convertidos - d.perdidos, d.no_kanban, d.convertidos, d.perdidos], backgroundColor: ['#3b82f6', '#f59e0b', '#10b981', '#ef4444'], borderWidth: 0 }]
        });
    }

    function renderVendedor(d) {
        document.getElementById('kpi-vendedor').innerHTML = `
            <div class="kpi-mini"><i class="ph ph-handshake"></i><div class="val">${d.op_fechadas}</div><div class="lab">Vendas</div></div>
            <div class="kpi-mini"><i class="ph ph-calendar"></i><div class="val">${d.r_concluidas}</div><div class="lab">Reuniões</div></div>
            <div class="kpi-mini"><i class="ph ph-currency-dollar"></i><div class="val">R$ ${d.valor_fechado || 0}</div><div class="lab">Faturamento</div></div>
        `;
    }

    function initChart(id, type, data) {
        if(charts[id]) charts[id].destroy();
        charts[id] = new Chart(document.getElementById(id), {
            type, data, options: { responsive: true, plugins: { legend: { position: 'bottom', labels: { color: '#94a3b8' } } } }
        });
    }
  </script>
</body>
</html>
