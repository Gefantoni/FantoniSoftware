<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard Comercial — Central do Negócio</title>
  <link rel="stylesheet" href="/assets/css/global.css">
  <link rel="stylesheet" href="/assets/css/painel.css">
  <link rel="stylesheet" href="/assets/css/comercial.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body class="com-page">
<div class="layout">
  <aside class="sidebar" id="sidebar"></aside>

  <div class="conteudo">
    <div class="topbar">
      <div class="flex items-center gap-2">
        <button class="sidebar-toggle" id="sidebar-toggle">☰</button>
        <span class="topbar-titulo">📊 Dashboard Comercial</span>
      </div>
      <span id="data-hoje" class="com-text-suave com-text-sm"></span>
    </div>

    <div class="pagina" style="padding:24px">

      <!-- KPIs -->
      <div class="kpi-grid" id="kpi-grid">
        <div class="kpi-card kpi-azul"><div class="kpi-icone">👤</div><div class="kpi-valor" id="k-total">—</div><div class="kpi-label">Total de Leads</div></div>
        <div class="kpi-card kpi-verde"><div class="kpi-icone">✅</div><div class="kpi-valor" id="k-hoje">—</div><div class="kpi-label">Contatados Hoje</div></div>
        <div class="kpi-card kpi-amarelo"><div class="kpi-icone">📊</div><div class="kpi-valor" id="k-taxa">—%</div><div class="kpi-label">Taxa de Resposta</div></div>
        <div class="kpi-card kpi-roxo"><div class="kpi-icone">🔥</div><div class="kpi-valor" id="k-interesse">—</div><div class="kpi-label">Com Interesse</div></div>
        <div class="kpi-card kpi-azul"><div class="kpi-icone">📋</div><div class="kpi-valor" id="k-kanban">—</div><div class="kpi-label">No Kanban</div></div>
        <div class="kpi-card kpi-amarelo"><div class="kpi-icone">📅</div><div class="kpi-valor" id="k-reunioes">—</div><div class="kpi-label">Reuniões Hoje</div></div>
        <div class="kpi-card kpi-verde"><div class="kpi-icone">🏆</div><div class="kpi-valor" id="k-fechados">—</div><div class="kpi-label">Fechados</div></div>
        <div class="kpi-card kpi-vermelho"><div class="kpi-icone">❌</div><div class="kpi-valor" id="k-perdidos">—</div><div class="kpi-label">Perdidos</div></div>
      </div>

      <div class="com-grid-2 com-mb-3">
        <!-- Funil de conversão -->
        <div class="com-card">
          <div class="com-card-titulo">Funil de Conversão</div>
          <div class="funil" id="funil-container">
            <div class="com-spinner"></div>
          </div>
        </div>

        <!-- Agenda do dia -->
        <div class="com-card">
          <div class="com-flex-between com-mb-2">
            <div class="com-card-titulo" style="margin:0">Agenda do Dia</div>
            <a href="/admin/comercial/calendario.html" class="com-btn com-btn-ghost com-btn-sm">Ver calendário</a>
          </div>
          <div id="agenda-hoje">
            <div class="com-spinner"></div>
          </div>
        </div>
      </div>

      <div class="com-grid-3 com-mb-3">
        <!-- Instância 1 -->
        <div class="com-card" id="inst-1">
          <div class="com-card-titulo">Instância 1</div>
          <div class="com-spinner"></div>
        </div>
        <!-- Instância 2 -->
        <div class="com-card" id="inst-2">
          <div class="com-card-titulo">Instância 2</div>
          <div class="com-spinner"></div>
        </div>
        <!-- Instância 3 -->
        <div class="com-card" id="inst-3">
          <div class="com-card-titulo">Instância 3</div>
          <div class="com-spinner"></div>
        </div>
      </div>

      <!-- Feed de atividade -->
      <div class="com-card">
        <div class="com-flex-between com-mb-2">
          <div class="com-card-titulo" style="margin:0">Atividade Recente</div>
          <a href="/admin/comercial/relatorios.html" class="com-btn com-btn-ghost com-btn-sm">Ver relatórios</a>
        </div>
        <div class="feed" id="feed-atividades">
          <div class="com-spinner"></div>
        </div>
      </div>

    </div>
  </div>
</div>

<script src="/assets/js/api.js"></script>
<script src="/assets/js/auth.js"></script>
<script src="/assets/js/sidebar-admin.js"></script>
<script>
const usuario = protegerPagina(['admin','comercial']);
if (usuario) {
  inicializarLayout();
  document.getElementById('data-hoje').textContent =
    new Date().toLocaleDateString('pt-BR',{weekday:'long',day:'numeric',month:'long'});
  carregarDashboard();
}

async function carregarDashboard() {
  try {
    const [dash, { funil }] = await Promise.all([
      api.get('/comercial/dashboard'),
      api.get('/relatorios-comercial/funil')
    ]);

    // KPIs
    const k = dash.kpis;
    document.getElementById('k-total').textContent    = k.total_leads;
    document.getElementById('k-hoje').textContent     = k.contatados_hoje;
    document.getElementById('k-taxa').textContent     = k.taxa_resposta + '%';
    document.getElementById('k-interesse').textContent = k.com_interesse;
    document.getElementById('k-kanban').textContent   = k.no_kanban;
    document.getElementById('k-reunioes').textContent = k.reunioes_hoje;
    document.getElementById('k-fechados').textContent = k.fechados;
    document.getElementById('k-perdidos').textContent = k.perdidos_ops;

    // Funil
    const maxTotal = funil[0]?.total || 1;
    document.getElementById('funil-container').innerHTML = funil.map(f => `
      <div class="funil-etapa">
        <span class="funil-label">${f.etapa}</span>
        <div class="funil-barra-wrap">
          <div class="funil-barra" style="width:${Math.max(4, (f.total / maxTotal) * 100)}%">
            ${f.total > 0 ? f.total : ''}
          </div>
        </div>
        <span class="funil-total">${f.total}</span>
      </div>
    `).join('');

    // Agenda do dia
    const reunioes = dash.reunioes_hoje;
    document.getElementById('agenda-hoje').innerHTML = reunioes.length ? reunioes.map(r => `
      <div style="padding:12px 0;border-bottom:1px solid var(--com-borda-suave);display:flex;gap:12px;align-items:flex-start">
        <div style="background:rgba(37,99,235,0.1);border-radius:8px;padding:8px 10px;text-align:center;flex-shrink:0">
          <div style="font-size:16px;font-weight:700;color:var(--com-azul-brilho)">${new Date(r.data_hora).toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'})}</div>
        </div>
        <div>
          <div style="font-size:14px;font-weight:600;color:var(--com-texto)">${r.titulo}</div>
          <div class="com-text-suave com-text-sm">${r.leads?.nome || r.leads?.empresa || '—'}</div>
          <span class="com-badge com-badge-${r.status==='concluida'?'verde':r.status==='cancelada'?'vermelho':'azul'}">${r.status}</span>
        </div>
      </div>
    `).join('') : '<p class="com-text-suave com-text-sm" style="text-align:center;padding:20px">Nenhuma reunião hoje</p>';

    // Instâncias
    const insts = dash.instancias;
    [0,1,2].forEach(i => {
      const el = document.getElementById(`inst-${i+1}`);
      const inst = insts[i];
      if (!inst) { el.innerHTML = `<div class="com-card-titulo">Instância ${i+1}</div><p class="com-text-suave com-text-sm">Não configurada</p>`; return; }
      el.innerHTML = `
        <div class="com-flex-between com-mb-2">
          <div class="com-card-titulo" style="margin:0">${inst.nome}</div>
          <span class="com-badge com-badge-${inst.status==='ativo'?'verde':'cinza'}">${inst.status}</span>
        </div>
        <div style="display:flex;flex-direction:column;gap:8px">
          ${statLinha('📤 Disparos', '—')}
          ${statLinha('💬 Respostas', '—')}
          ${statLinha('🔥 Oportunidades', '—')}
          ${statLinha('📅 Reuniões', '—')}
        </div>`;
    });

    // Feed de atividades
    const atividades = dash.atividades_recentes;
    const emojiTipo = { oportunidade_criada:'🎯', kanban_movido:'📋', reuniao_criada:'📅', reuniao_concluida:'✅', ia_desativada:'🤖', humano_assumiu:'👤', campanha_iniciada:'📢' };
    document.getElementById('feed-atividades').innerHTML = atividades.length ? atividades.map(a => `
      <div class="feed-item">
        <div class="feed-icone">${emojiTipo[a.tipo] || '📌'}</div>
        <div class="feed-corpo">
          <div class="feed-texto">${a.descricao}</div>
          <div class="feed-meta">${a.perfis?.nome || 'Sistema'} · ${formatarData(a.criado_em)}</div>
        </div>
      </div>
    `).join('') : '<p class="com-text-suave com-text-sm" style="text-align:center;padding:20px">Nenhuma atividade registrada</p>';

  } catch(err) {
    console.error('Erro ao carregar dashboard comercial:', err);
  }
}

function statLinha(label, valor) {
  return `<div class="com-flex-between"><span class="com-text-suave com-text-sm">${label}</span><span style="font-weight:600;color:var(--com-texto)">${valor}</span></div>`;
}
</script>
</body>
</html>
