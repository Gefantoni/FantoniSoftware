<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Usuários — Admin — Central do Negócio</title>
  <script src="https://unpkg.com/@phosphor-icons/web"></script>
  <link rel="stylesheet" href="/assets/css/global.css">
  <link rel="stylesheet" href="/assets/css/painel.css">
  <style>
    .role-badge { display:inline-flex; align-items:center; gap:6px; padding:4px 12px; border-radius:20px; font-size:11px; font-weight:700; text-transform:uppercase; }
    .role-admin { background: rgba(99, 102, 241, 0.1); color: #818cf8; border: 1px solid rgba(99, 102, 241, 0.2); }
    .role-cliente { background: rgba(16, 185, 129, 0.1); color: #34d399; border: 1px solid rgba(16, 185, 129, 0.2); }
    .role-suporte { background: rgba(245, 158, 11, 0.1); color: #fbbf24; border: 1px solid rgba(245, 158, 11, 0.2); }
    .role-financeiro { background: rgba(168, 85, 247, 0.1); color: #c084fc; border: 1px solid rgba(168, 85, 247, 0.2); }
    .role-comercial { background: rgba(20, 184, 166, 0.1); color: #2dd4bf; border: 1px solid rgba(20, 184, 166, 0.2); }

    .tabs { display:flex; gap:24px; border-bottom:1px solid var(--borda); margin-bottom:24px; }
    .tab { padding:12px 0; font-size:14px; font-weight:500; color:var(--texto-suave); cursor:pointer; border-bottom:2px solid transparent; transition:var(--transicao); }
    .tab:hover { color: var(--texto); }
    .tab.ativo { color:var(--primaria); border-color:var(--primaria); font-weight:600; }

    .permissao-item { display:flex; align-items:center; justify-content:space-between; padding:12px 16px; background: rgba(255,255,255,0.02); border: 1px solid var(--borda); border-radius: 8px; margin-bottom: 8px; }
  </style>
</head>
<body>
  <div class="app-layout">
    <aside class="app-sidebar" id="sidebar"></aside>

    <main class="app-content">
      <header class="app-header"></header>

      <div class="app-body">
        <div class="justify-between flex items-center mb-4">
          <div class="page-title">
            <h1>Gestão de Usuários</h1>
            <p class="text-suave">Administre clientes e permissões da equipe interna.</p>
          </div>
          <button class="btn btn-primario" onclick="abrirModalNovoUsuario()">
            <i class="ph ph-plus i-md"></i> Novo Usuário
          </button>
        </div>

        <div class="tabs">
          <div class="tab ativo" onclick="mudarTab(this, '')">Todos</div>
          <div class="tab" onclick="mudarTab(this, 'cliente')">Clientes</div>
          <div class="tab" onclick="mudarTab(this, 'admin')">Admin</div>
          <div class="tab" onclick="mudarTab(this, 'suporte')">Suporte</div>
          <div class="tab" onclick="mudarTab(this, 'financeiro')">Financeiro</div>
          <div class="tab" onclick="mudarTab(this, 'comercial')">Comercial</div>
        </div>

        <div class="card mb-4" style="padding: 16px;">
          <div class="flex gap-2">
            <div style="position:relative; flex:1">
              <i class="ph ph-magnifying-glass" style="position:absolute; left:12px; top:50%; transform:translateY(-50%); color:var(--texto-muted)"></i>
              <input type="text" id="busca" placeholder="Buscar por nome ou email..." 
                     style="width:100%; padding:10px 10px 10px 40px; background:rgba(255,255,255,0.02); border:1.5px solid var(--borda); border-radius:8px; color:#fff"
                     oninput="filtrar()">
            </div>
          </div>
        </div>

        <div class="card">
          <div class="tabela-container">
            <table id="tabela-usuarios">
              <thead>
                <tr>
                  <th>Nome</th><th>Email</th><th>WhatsApp</th>
                  <th>Tipo</th><th>Plano</th><th>Status</th><th>Ações</th>
                </tr>
              </thead>
              <tbody id="tbody-usuarios">
                <tr><td colspan="7" class="text-center"><div class="spinner" style="margin:24px auto"></div></td></tr>
              </tbody>
            </table>
          </div>
        </div>
      </div>
    </main>
  </div>

  <!-- Modal Cadastro -->
  <div id="modal-usuario" class="modal-overlay d-none">
    <div class="modal">
      <div class="modal-header">
        <h3 id="modal-titulo">Novo Usuário</h3>
        <button class="modal-fechar" onclick="fecharModal('modal-usuario')">✕</button>
      </div>
      <form id="form-usuario" onsubmit="salvarUsuario(event)" class="p-4">
        <input type="hidden" id="u-id">
        <div class="form-grupo">
          <label>Tipo de usuário</label>
          <select id="u-role" class="form-control" required onchange="atualizarCamposRole()">
            <option value="cliente">Cliente</option>
            <option value="admin">Administrador</option>
            <option value="suporte">Suporte</option>
            <option value="financeiro">Financeiro</option>
            <option value="comercial">Comercial</option>
          </select>
        </div>
        <div class="form-grupo"><label>Nome completo</label><input type="text" id="u-nome" class="form-control" required></div>
        <div class="form-grupo"><label>Email</label><input type="email" id="u-email" class="form-control" required></div>
        <div id="campo-senha" class="form-grupo">
          <label>Senha inicial</label>
          <input type="password" id="u-senha" class="form-control" minlength="6">
        </div>
        <div class="form-grupo"><label>WhatsApp</label><input type="text" id="u-whatsapp" class="form-control" placeholder="5511999999999"></div>
        <div id="campo-plano" class="form-grupo">
          <label>Plano</label>
          <select id="u-plano" class="form-control">
            <option value="basico">Básico</option>
            <option value="profissional">Profissional</option>
            <option value="premium">Premium</option>
          </select>
        </div>
        <button type="submit" class="btn btn-primario w-100 mt-2" id="btn-salvar-u">Salvar Usuário</button>
      </form>
    </div>
  </div>

  <!-- Modal Permissões -->
  <div id="modal-permissoes" class="modal-overlay d-none">
    <div class="modal" style="max-width:480px">
      <div class="modal-header">
        <h3 class="modal-titulo">🔐 Permissões do Cliente</h3>
        <button class="modal-fechar" onclick="fecharModal('modal-permissoes')">✕</button>
      </div>
      <div class="p-4">
        <p class="text-suave mb-4 text-xs" id="perm-nome-usuario"></p>
        <div id="lista-permissoes"></div>
        <button class="btn btn-primario w-100 mt-4" onclick="salvarPermissoes()">Aplicar Permissões</button>
      </div>
    </div>
  </div>

  <script src="/assets/js/api.js"></script>
  <script src="/assets/js/auth.js"></script>
  <script src="/assets/js/sidebar-admin.js"></script>
  <script>
    const usuario = protegerPagina(['admin']);
    let todosUsuarios = [];
    let modoEdicao = false;
    let idPermissaoAtual = null;
    let tabAtual = '';

    const TELAS_CLIENTE = [
      { id: 'videoaulas', label: 'EAD / Treinamento', icon: 'ph-graduation-cap' },
      { id: 'agente_ia', label: 'Agente Suporte IA', icon: 'ph-robot' },
      { id: 'cardapio_ia', label: 'IA p/ Cardápio', icon: 'ph-magic-wand' },
      { id: 'financeiro', label: 'Financeiro', icon: 'ph-currency-dollar' },
      { id: 'tickets', label: 'Suporte / Tickets', icon: 'ph-ticket' },
      { id: 'empreendedorismo', label: 'Guia Empreendedor', icon: 'ph-briefcase' }
    ];

    if (usuario) { inicializarLayout(); carregarUsuarios(); }

    async function carregarUsuarios() {
      try {
        const url = tabAtual ? `/clientes?role=${tabAtual}` : '/clientes';
        const { clientes } = await api.get(url);
        todosUsuarios = clientes;
        filtrar();
      } catch {
        document.getElementById('tbody-usuarios').innerHTML = '<tr><td colspan="7" class="text-center text-suave">Erro ao carregar dados.</td></tr>';
      }
    }

    function mudarTab(el, role) {
      document.querySelectorAll('.tab').forEach(t => t.classList.remove('ativo'));
      el.classList.add('ativo');
      tabAtual = role;
      carregarUsuarios();
    }

    function filtrar() {
      const busca = document.getElementById('busca').value.toLowerCase();
      const filtrados = todosUsuarios.filter(c => !busca || c.nome?.toLowerCase().includes(busca) || c.email?.toLowerCase().includes(busca));
      renderizarTabela(filtrados);
    }

    function mapearRole(role) {
      const r = { admin:'Admin', cliente:'Cliente', suporte:'Suporte', financeiro:'Finan', comercial:'Comer' };
      return r[role] || role;
    }

    function renderizarTabela(lista) {
      const tbody = document.getElementById('tbody-usuarios');
      if (!lista.length) { tbody.innerHTML = '<tr><td colspan="7" class="text-center text-suave">Nenhum registro.</td></tr>'; return; }
      
      const planoBadge = { basico:'badge-cinza', profissional:'badge-azul', premium:'badge-amarelo' };
      tbody.innerHTML = lista.map(c => `
        <tr>
          <td><div class="fw-600 text-white">${c.nome}</div><div class="text-xs text-suave">${c.id.split('-')[0]}</div></td>
          <td>${c.email}</td>
          <td>${c.whatsapp || '—'}</td>
          <td><span class="role-badge role-${c.role}">${mapearRole(c.role)}</span></td>
          <td>${c.role === 'cliente' ? `<span class="badge ${planoBadge[c.plano]||'badge-cinza'}">${c.plano||'—'}</span>` : '—'}</td>
          <td><span class="badge ${c.ativo ? 'badge-verde' : 'badge-vermelho'}">${c.ativo ? 'Ativo' : 'Inativo'}</span></td>
          <td>
            <div class="flex gap-1">
              <button class="btn btn-outline btn-sm" onclick="editarUsuario('${c.id}')"><i class="ph ph-note-pencil"></i></button>
              ${c.role === 'cliente' ? `<button class="btn btn-outline btn-sm" onclick="abrirPermissoes('${c.id}')"><i class="ph ph-lock-key"></i></button>` : ''}
              <button class="btn btn-sm ${c.ativo ? 'btn-perigo' : 'btn-primario'}" onclick="toggleAtivo('${c.id}', ${!c.ativo})">
                <i class="ph ${c.ativo ? 'ph-user-minus' : 'ph-user-plus'}"></i>
              </button>
            </div>
          </td>
        </tr>`).join('');
    }

    function abrirModalNovoUsuario() {
      modoEdicao = false; document.getElementById('modal-titulo').textContent = 'Novo Usuário';
      document.getElementById('form-usuario').reset(); document.getElementById('campo-senha').style.display = 'block';
      document.getElementById('u-id').value = ''; document.getElementById('modal-usuario').classList.remove('d-none');
    }

    function editarUsuario(id) {
      const c = todosUsuarios.find(x => x.id === id); if (!c) return;
      modoEdicao = true; document.getElementById('modal-titulo').textContent = 'Editar Usuário';
      document.getElementById('u-id').value = c.id; document.querySelector('#u-role').value = c.role;
      document.getElementById('u-nome').value = c.nome; document.getElementById('u-email').value = c.email;
      document.getElementById('u-whatsapp').value = c.whatsapp || ''; document.getElementById('u-plano').value = c.plano || 'basico';
      document.getElementById('campo-senha').style.display = 'none'; document.getElementById('modal-usuario').classList.remove('d-none');
      atualizarCamposRole();
    }

    function atualizarCamposRole() {
      document.getElementById('campo-plano').style.display = document.getElementById('u-role').value === 'cliente' ? 'block' : 'none';
    }

    function fecharModal(id) { document.getElementById(id).classList.add('d-none'); }

    async function salvarUsuario(e) {
      e.preventDefault();
      const btn = document.getElementById('btn-salvar-u'); btn.disabled = true;
      const id = document.getElementById('u-id').value;
      const dados = { nome: document.getElementById('u-nome').value, email: document.getElementById('u-email').value, whatsapp: document.getElementById('u-whatsapp').value, role: document.getElementById('u-role').value, plano: document.getElementById('u-plano').value };
      if (!modoEdicao) dados.senha = document.getElementById('u-senha').value;
      try {
        if (modoEdicao) await api.put(`/clientes/${id}`, dados); else await api.post('/clientes', dados);
        fecharModal('modal-usuario'); carregarUsuarios(); mostrarAlerta('Sucesso!');
      } catch (err) { alert(err.erro || 'Erro ao salvar'); } finally { btn.disabled = false; }
    }

    async function toggleAtivo(id, ativo) {
      if(!confirm(`Deseja ${ativo?'ativar':'desativar'} este usuário?`)) return;
      try { await api.patch(`/clientes/${id}/ativar`, { ativo }); carregarUsuarios(); } catch { alert('Erro ao mudar status'); }
    }

    function abrirPermissoes(id) {
      const c = todosUsuarios.find(x => x.id === id); if (!c) return; idPermissaoAtual = id;
      document.getElementById('perm-nome-usuario').textContent = `${c.nome} (${c.email})`;
      const perms = c.permissoes_telas || {};
      document.getElementById('lista-permissoes').innerHTML = TELAS_CLIENTE.map(t => `
        <div class="permissao-item">
          <div class="flex items-center gap-2">
            <i class="ph ${t.icon} i-md" style="color:var(--primaria)"></i>
            <span class="text-sm text-white">${t.label}</span>
          </div>
          <label class="switch-toggle" style="position:relative; width:40px; height:20px;">
            <input type="checkbox" id="perm-${t.id}" ${perms[t.id] !== false ? 'checked' : ''} style="width:100%; height:100%; opacity:0; cursor:pointer; position:absolute; z-index:2">
            <span style="position:absolute; top:0; left:0; right:0; bottom:0; background:rgba(255,255,255,0.1); border-radius:20px; transition:.3s"></span>
          </label>
        </div>
      `).join('');
      document.getElementById('modal-permissoes').classList.remove('d-none');
    }

    async function salvarPermissoes() {
      const permissoes_telas = {}; TELAS_CLIENTE.forEach(t => { permissoes_telas[t.id] = document.getElementById(`perm-${t.id}`).checked; });
      try { await api.patch(`/clientes/${idPermissaoAtual}/permissoes`, { permissoes_telas }); fecharModal('modal-permissoes'); carregarUsuarios(); mostrarAlerta('Permissões salvas!'); } catch { alert('Erro ao salvar'); }
    }
  </script>
</body>
</html>
