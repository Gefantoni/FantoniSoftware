<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Módulos e Aulas — Admin — Central do Negócio</title>
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <link rel="stylesheet" href="/assets/css/global.css">
    <link rel="stylesheet" href="/assets/css/painel.css">
    <style>
        .module-card {
            background: var(--fundo-card); border: 1px solid var(--borda);
            border-radius: var(--radius-lg); margin-bottom: 24px; overflow: hidden;
        }
        .module-header {
            padding: 20px 24px; background: rgba(255,255,255,0.02);
            border-bottom: 1px solid var(--borda); display: flex; align-items: center; justify-content: space-between;
        }
        .lesson-row {
            padding: 12px 24px; border-bottom: 1px solid var(--borda);
            display: flex; align-items: center; justify-content: space-between;
            transition: var(--transicao);
        }
        .lesson-row:hover { background: rgba(255,255,255,0.02); }
        .lesson-row:last-child { border-bottom: none; }
        
        .tab-nav { display: flex; gap: 24px; border-bottom: 1px solid var(--borda); margin-bottom: 32px; }
        .tab-link { padding: 12px 0; font-size: 14px; color: var(--texto-suave); cursor: pointer; border-bottom: 2px solid transparent; }
        .tab-link.active { color: var(--primaria); border-color: var(--primaria); font-weight: 600; }
        
        .empty-state { padding: 40px; text-align: center; color: var(--texto-suave); }
    </style>
</head>
<body>
  <div class="app-layout">
    <aside class="app-sidebar" id="sidebar"></aside>

    <main class="app-content">
      <header class="app-header"></header>

      <div class="app-body">
        <div class="justify-between flex items-center mb-4">
          <div class="page-title">
            <h1>Conteúdo e EAD</h1>
            <p class="text-suave">Gerencie os módulos de treinamento e a base de conhecimento da IA.</p>
          </div>
          <div class="flex gap-2">
            <button class="btn btn-outline" onclick="abrirModalModulo()">
                <i class="ph ph-plus i-md"></i> Novo Módulo
            </button>
          </div>
        </div>

        <div class="tab-nav">
          <div class="tab-link active" id="tab-btn-modulos" onclick="abrirTab('modulos')">Módulos de Vídeo</div>
          <div class="tab-link" id="tab-btn-base" onclick="abrirTab('base')">Base de IA</div>
        </div>

        <!-- Conteúdo Módulos -->
        <div id="tab-content-modulos">
          <div id="lista-modulos"><div class="spinner" style="margin:40px auto"></div></div>
        </div>

        <!-- Conteúdo Base IA -->
        <div id="tab-content-base" class="d-none">
          <div class="justify-between flex items-center mb-4">
              <h2 class="text-lg fw-700 text-white">Treinamento do Chatbot</h2>
              <button class="btn btn-primario btn-sm" onclick="abrirModalBase()">
                  <i class="ph ph-plus"></i> Adicionar Item
              </button>
          </div>
          <div id="lista-base"></div>
        </div>
      </div>
    </main>
  </div>

  <!-- Modais -->
  <div id="modal-modulo" class="modal-overlay d-none">
    <div class="modal">
      <div class="modal-header">
        <h3 id="mod-titulo-modal">Novo Módulo</h3>
        <button class="modal-fechar" onclick="fecharModais()">✕</button>
      </div>
      <form onsubmit="salvarModulo(event)" class="p-4">
        <input type="hidden" id="mod-id">
        <div class="form-grupo"><label>Título</label><input type="text" id="mod-titulo" class="form-control" required></div>
        <div class="form-grupo"><label>Descrição</label><textarea id="mod-desc" class="form-control" rows="3"></textarea></div>
        <div class="grid-2">
          <div class="form-grupo">
            <label>Plano mínimo</label>
            <select id="mod-plano" class="form-control">
              <option value="basico">Básico</option>
              <option value="profissional">Profissional</option>
              <option value="premium">Premium</option>
            </select>
          </div>
          <div class="form-grupo"><label>Ordem</label><input type="number" id="mod-ordem" class="form-control" value="0"></div>
        </div>
        <button type="submit" class="btn btn-primario w-100 mt-2">Salvar Módulo</button>
      </form>
    </div>
  </div>

  <div id="modal-aula" class="modal-overlay d-none">
    <div class="modal">
      <div class="modal-header">
        <h3 id="aula-titulo-modal">Nova Aula</h3>
        <button class="modal-fechar" onclick="fecharModais()">✕</button>
      </div>
      <form onsubmit="salvarAula(event)" class="p-4">
        <input type="hidden" id="aula-id">
        <input type="hidden" id="aula-modulo-id">
        <div class="form-grupo"><label>Título</label><input type="text" id="aula-titulo" class="form-control" required></div>
        <div class="form-grupo"><label>URL do Vídeo (Embed)</label><input type="url" id="aula-url" class="form-control" placeholder="https://youtube.com/embed/..." required></div>
        <div class="grid-2">
            <div class="form-grupo"><label>Ordem</label><input type="number" id="aula-ordem" class="form-control" value="0"></div>
            <div class="form-grupo"><label>Segundos</label><input type="number" id="aula-duracao" class="form-control" value="0"></div>
        </div>
        <button type="submit" class="btn btn-primario w-100 mt-2">Salvar Aula</button>
      </form>
    </div>
  </div>

  <div id="modal-base" class="modal-overlay d-none">
    <div class="modal">
      <div class="modal-header">
        <h3>Treinar Inteligência Artificial</h3>
        <button class="modal-fechar" onclick="fecharModais()">✕</button>
      </div>
      <form onsubmit="salvarBase(event)" class="p-4">
        <input type="hidden" id="base-id">
        <div class="form-grupo"><label>Pergunta ou Contexto</label><input type="text" id="base-pergunta" class="form-control" required></div>
        <div class="form-grupo"><label>Resposta da IA</label><textarea id="base-resposta" class="form-control" rows="6" required></textarea></div>
        <div class="form-grupo"><label>Tags (vírgula)</label><input type="text" id="base-tags" class="form-control" placeholder="financeiro, erro, ajuda"></div>
        <button type="submit" class="btn btn-primario w-100 mt-2">Treinar IA</button>
      </form>
    </div>
  </div>

  <script src="/assets/js/api.js"></script>
  <script src="/assets/js/auth.js"></script>
  <script src="/assets/js/sidebar-admin.js"></script>
  <script>
    const usuario = protegerPagina(['admin']);
    let modulosCache = {}, baseCache = {};

    if (usuario) { inicializarLayout(); carregarModulos(); }

    function abrirTab(tab) {
        document.getElementById('tab-content-modulos').classList.toggle('d-none', tab !== 'modulos');
        document.getElementById('tab-content-base').classList.toggle('d-none', tab !== 'base');
        document.getElementById('tab-btn-modulos').classList.toggle('active', tab === 'modulos');
        document.getElementById('tab-btn-base').classList.toggle('active', tab === 'base');
        if(tab === 'base') carregarBase();
    }

    async function carregarModulos() {
        try {
            const { modulos } = await api.get('/videoaulas/admin/modulos');
            renderizarModulos(modulos);
        } catch { 
            document.getElementById('lista-modulos').innerHTML = '<div class="empty-state">Erro ao carregar módulos.</div>';
        }
    }

    function renderizarModulos(modulos) {
        const container = document.getElementById('lista-modulos');
        if(!modulos.length) { container.innerHTML = '<div class="empty-state">Nenhum módulo criado.</div>'; return; }
        
        container.innerHTML = modulos.map(m => {
            modulosCache[m.id] = m;
            return `
            <div class="module-card">
                <div class="module-header">
                    <div>
                        <div class="text-xs text-suave uppercase ls-1 mb-1">Módulo</div>
                        <h3 class="text-white fw-700">${m.titulo}</h3>
                    </div>
                    <div class="flex gap-2">
                        <button class="btn btn-acento btn-sm" onclick="abrirModalAula(${m.id})"><i class="ph ph-plus"></i> Aula</button>
                        <button class="btn btn-outline btn-sm" onclick="editarModulo(${m.id})"><i class="ph ph-pencil"></i></button>
                        <button class="btn btn-perigo btn-sm" onclick="excluirModulo(${m.id})"><i class="ph ph-trash"></i></button>
                    </div>
                </div>
                <div class="lessons-list">
                    ${(m.videoaulas || []).map(a => `
                        <div class="lesson-row">
                            <div class="flex items-center gap-3">
                                <i class="ph ph-play-circle text-primary"></i>
                                <span class="text-sm text-white">${a.titulo}</span>
                            </div>
                            <div class="flex gap-1">
                                <button class="btn btn-icon-sm" onclick="editarAula(${m.id}, ${a.id})"><i class="ph ph-note-pencil"></i></button>
                                <button class="btn btn-icon-sm text-erro" onclick="excluirAula(${a.id})"><i class="ph ph-x"></i></button>
                            </div>
                        </div>
                    `).join('') || '<div class="p-4 text-center text-xs text-suave">Nenhuma aula.</div>'}
                </div>
            </div>`;
        }).join('');
    }

    function abrirModalModulo() {
        document.getElementById('form-modulo').reset();
        document.getElementById('mod-id').value = '';
        document.getElementById('modal-modulo').classList.remove('d-none');
    }

    function editarModulo(id) {
        const m = modulosCache[id];
        document.getElementById('mod-id').value = m.id;
        document.getElementById('mod-titulo').value = m.titulo;
        document.getElementById('mod-desc').value = m.descricao || '';
        document.getElementById('mod-plano').value = m.plano_minimo;
        document.getElementById('mod-ordem').value = m.ordem;
        document.getElementById('modal-modulo').classList.remove('d-none');
    }

    async function salvarModulo(e) {
        e.preventDefault();
        const id = document.getElementById('mod-id').value;
        const dados = { titulo: document.getElementById('mod-titulo').value, descricao: document.getElementById('mod-desc').value, plano_minimo: document.getElementById('mod-plano').value, ordem: document.getElementById('mod-ordem').value };
        try {
            if(id) await api.put(`/videoaulas/admin/modulos/${id}`, dados);
            else await api.post('/videoaulas/admin/modulos', dados);
            fecharModais(); carregarModulos(); mostrarAlerta('Módulo salvo!');
        } catch(err) { alert(err.erro || 'Erro'); }
    }

    function abrirModalAula(moduloId) {
        document.getElementById('aula-modulo-id').value = moduloId;
        document.getElementById('aula-id').value = '';
        document.getElementById('modal-aula').classList.remove('d-none');
    }

    function editarAula(modId, aulaId) {
        const a = modulosCache[modId].videoaulas.find(x => x.id === aulaId);
        document.getElementById('aula-modulo-id').value = modId;
        document.getElementById('aula-id').value = a.id;
        document.getElementById('aula-titulo').value = a.titulo;
        document.getElementById('aula-url').value = a.url_video;
        document.getElementById('aula-ordem').value = a.ordem;
        document.getElementById('aula-duracao').value = a.duracao_seg;
        document.getElementById('modal-aula').classList.remove('d-none');
    }

    async function salvarAula(e) {
        e.preventDefault();
        const id = document.getElementById('aula-id').value;
        const dados = { modulo_id: document.getElementById('aula-modulo-id').value, titulo: document.getElementById('aula-titulo').value, url_video: document.getElementById('aula-url').value, ordem: document.getElementById('aula-ordem').value, duracao_seg: document.getElementById('aula-duracao').value };
        try {
            if(id) await api.put(`/videoaulas/admin/aulas/${id}`, dados);
            else await api.post('/videoaulas/admin/aulas', dados);
            fecharModais(); carregarModulos();
        } catch(err) { alert(err.erro); }
    }

    async function carregarBase() {
        try {
            const { base } = await api.get('/agente-ia/base');
            const container = document.getElementById('lista-base');
            base.forEach(b => baseCache[b.id] = b);
            container.innerHTML = base.map(b => `
                <div class="card mb-2 flex items-center justify-between p-3">
                    <div>
                        <div class="fw-600 text-white text-sm">${b.pergunta}</div>
                        <div class="text-xs text-suave">${b.resposta.substring(0,60)}...</div>
                    </div>
                    <div class="flex gap-1">
                        <button class="btn btn-icon-sm" onclick="editarBase(${b.id})"><i class="ph ph-note-pencil"></i></button>
                        <button class="btn btn-icon-sm text-erro" onclick="excluirBase(${b.id})"><i class="ph ph-trash"></i></button>
                    </div>
                </div>
            `).join('');
        } catch {}
    }

    function abrirModalBase() { document.getElementById('base-id').value = ''; document.getElementById('modal-base').classList.remove('d-none'); }
    function editarBase(id) {
        const b = baseCache[id];
        document.getElementById('base-id').value = b.id;
        document.getElementById('base-pergunta').value = b.pergunta;
        document.getElementById('base-resposta').value = b.resposta;
        document.getElementById('modal-base').classList.remove('d-none');
    }

    async function salvarBase(e) {
        e.preventDefault();
        const id = document.getElementById('base-id').value;
        const dados = { pergunta: document.getElementById('base-pergunta').value, resposta: document.getElementById('base-resposta').value };
        try {
            if(id) await api.put(`/agente-ia/base/${id}`, dados);
            else await api.post('/agente-ia/base', dados);
            fecharModais(); carregarBase();
        } catch(err) { alert(err.erro); }
    }

    async function excluirModulo(id) { if(confirm('Excluir módulo?')) { await api.delete(`/videoaulas/admin/modulos/${id}`); carregarModulos(); } }
    async function excluirAula(id) { if(confirm('Excluir aula?')) { await api.delete(`/videoaulas/admin/aulas/${id}`); carregarModulos(); } }
    async function excluirBase(id) { if(confirm('Excluir treinamento?')) { await api.delete(`/agente-ia/base/${id}`); carregarBase(); } }

    function fecharModais() { document.querySelectorAll('.modal-overlay').forEach(m => m.classList.add('d-none')); }
  </script>
</body>
</html>
